L.push({
id:21, unit:'D', title:'Reduction potential and standard electrode potential (E°)',
outcome:'Define the reduction potential and standard electrode potential (E°)', ref:'Table 1 + textbook', pages:'29, 30',
fig:'eladder',
html:`
<div class="key"><h4>Definitions</h4>
<p><b>Reduction potential</b>: the tendency of a substance to <b>gain electrons</b> (be reduced).</p>
<p><b>Standard reduction (electrode) potential, E°</b>: the potential of a half-cell measured <b>against the standard hydrogen electrode</b> under <b>standard conditions</b>: <b>25 °C, 1 atm (101.3 kPa), 1 M</b> solutions.</p></div>
<ul class="bul"><li>The ° symbol means <b>standard conditions</b>.</li>
<li>Table 1 lists all half-reactions as <b>reductions</b>.</li>
<li><b>More positive E°</b> → greater tendency to be <b>reduced</b> → stronger <b>oxidizing agent</b> (e.g., F₂ +2.87 V).</li>
<li><b>More negative E°</b> → more easily <b>oxidized</b> → stronger <b>reducing agent</b> (e.g., Li −3.04 V).</li>
<li>You cannot measure the potential of one half-cell alone — only a <b>difference</b>, so a reference (SHE = 0.00 V) is needed.</li></ul>
<div class="ex"><h5>Example</h5><p>E°(Cu²⁺/Cu) = +0.34 V and E°(Zn²⁺/Zn) = −0.76 V → Cu²⁺ is reduced more readily than Zn²⁺; Zn is oxidized more readily than Cu.</p></div>`,
checks:[
{q:'What does the ° in E° indicate?',o:['Measured under standard conditions (25 °C, 1 atm, 1 M)','Measured at 0 °C','The voltage is zero','The potential must be positive'],a:0,e:'Standard conditions: 25 °C (298 K), 1 atm, 1 M concentrations.',w:['','Standard temperature for E° is 25 °C, not 0 °C.','Only the SHE is defined as 0.00 V.','E° values can be negative.']},
{q:'Given E°(Co²⁺/Co) = −0.28 V and E°(Cu²⁺/Cu) = +0.34 V, which ion is more readily reduced?',o:['Cu²⁺','Co²⁺','Both equally','Cannot be determined'],a:0,e:'The more positive E°, the greater the tendency to be reduced.',w:['','Co²⁺ has the more negative (lower) value.','The values are different.','E° values let you compare directly.']},
{q:'Which species is the strongest oxidizing agent? E°: F₂ +2.87 V, Cl₂ +1.36 V, Ag⁺ +0.80 V, Li⁺ −3.04 V',o:['F₂','Cl₂','Ag⁺','Li⁺'],a:0,e:'Highest E° = strongest tendency to gain electrons = strongest oxidizing agent.',w:['','Cl₂ is weaker than F₂.','Ag⁺ is weaker than both halogens.','Li⁺ has the lowest E° — the weakest oxidizing agent (Li metal is the strongest reducing agent).']}
]});

L.push({
id:22, unit:'D', title:'The standard hydrogen electrode (SHE)',
outcome:'Describe standard hydrogen electrode (SHE), while identifying the importance of its E° value and writing the half-cell reactions of the two possible reactions that could occur at the hydrogen electrode', ref:'Figures 5, 6 + textbook', pages:'29, 31',
video:{id:'CQ7gYg64Msc', t:'Zinc – standard hydrogen electrode cell animation'},
fig:'she',
html:`
<div class="key"><h4>Construction</h4>
<ul><li>A <b>platinum electrode</b> (inert, covered with fine Pt) in</li><li>a <b>1 M H⁺</b> solution (acid), with</li><li><b>H₂ gas at 1 atm</b> bubbled over the electrode, at <b>25 °C</b>.</li></ul>
<p><b>E° = 0.00 V</b> (assigned by convention).</p></div>
<h4>Why is it important?</h4><p>The potential of a single half-cell cannot be measured — only the <b>difference</b> between two. Giving the SHE the value <b>zero</b> makes it the <b>reference</b>, so every other half-cell’s E° is just the voltage measured against it.</p>
<div class="two"><div class="card c2"><h4>SHE as cathode (reduction)</h4><div class="eq">2H⁺(aq) + 2e⁻ → H₂(g)</div><p>When paired with a half-cell with <b>negative</b> E° (e.g., Zn, −0.76 V).</p></div>
<div class="card c1"><h4>SHE as anode (oxidation)</h4><div class="eq">H₂(g) → 2H⁺(aq) + 2e⁻</div><p>When paired with a half-cell with <b>positive</b> E° (e.g., Cu, +0.34 V).</p></div></div>
<div class="ex"><h5>Measuring E°(Zn²⁺/Zn)</h5><p>Zn | Zn²⁺ ‖ H⁺ | H₂ | Pt reads 0.76 V with Zn as the anode → E°(Zn²⁺/Zn) = <b>−0.76 V</b>.</p></div>`,
checks:[
{q:'What is the standard electrode potential of the SHE?',o:['0.00 V','+1.00 V','−0.76 V','+0.34 V'],a:0,e:'It is defined (assigned) as exactly 0.00 V at standard conditions.',w:['','There is no such definition.','That is Zn²⁺/Zn.','That is Cu²⁺/Cu.']},
{q:'A Cu²⁺/Cu half-cell (+0.34 V) is connected to the SHE. What happens at the SHE?',o:['H₂ → 2H⁺ + 2e⁻ (it is the anode)','2H⁺ + 2e⁻ → H₂ (it is the cathode)','Nothing happens','Cu is deposited on it'],a:0,e:'Cu²⁺ has the higher E°, so it is reduced; the SHE must be oxidized → anode.',w:['','The SHE is the cathode only against half-cells with negative E°.','Electrons flow, so a reaction occurs.','Cu deposits on the copper electrode, not the platinum.']},
{q:'Why is the SHE needed?',o:['Because the potential of a single half-cell cannot be measured alone, so a reference is needed','Because hydrogen is the strongest oxidizing agent','Because platinum reacts with every metal','Because it produces the highest voltage'],a:0,e:'Only potential differences are measurable; the SHE is the agreed zero reference.',w:['','Hydrogen is neither the strongest oxidizer nor reducer (it is at 0.00 V).','Platinum is chosen because it is inert.','It is a reference, not a high-voltage cell.']}
]});

L.push({
id:23, unit:'D', title:'Calculating E°cell and spontaneity',
outcome:'Use the half-cell standard reduction potentials to calculate the electrochemical cell standard potential, while determining whether the redox reactions are spontaneous or non-spontaneous', ref:'Textbook + Example Problem 1 + practice + Table 3', pages:'32, 33, 34',
video:{id:'IV4IUsholjg', t:'Electrochemistry — Crash Course Chemistry #36'},
html:`
<div class="key"><h4>The formula</h4><div class="eq big">E°cell = E°reduction − E°oxidation = E°cathode − E°anode</div>
<p>Both values are taken <b>straight from the reduction table</b> — do not change any sign before subtracting.</p>
<p><b>E°cell &gt; 0</b> → <b>spontaneous</b> (voltaic). <b>E°cell &lt; 0</b> → <b>non-spontaneous</b> (needs electrolysis).</p></div>
<div class="ex"><h5>Worked example: Mg–Ag cell</h5>
<p>E°(Ag⁺/Ag) = +0.80 V, E°(Mg²⁺/Mg) = −2.37 V</p>
<ol><li>Higher E° → reduced → <b>cathode = Ag</b>. Lower → oxidized → <b>anode = Mg</b>.</li>
<li>E°cell = +0.80 − (−2.37) = <b>+3.17 V</b> → spontaneous.</li></ol>
<div class="eq good">Mg + 2Ag⁺ → Mg²⁺ + 2Ag &nbsp;&nbsp; E°cell = +3.17 V</div></div>
<div class="trap">⚠️ <b>Never multiply E° by the coefficients!</b> Doubling Ag⁺ + e⁻ → Ag to balance electrons does NOT double +0.80 V. E° is an intensive property.</div>
<div class="tip">📌 Shortcut for the spontaneous direction: <b>higher E° = cathode</b>, so E°cell = (bigger) − (smaller) and is always positive.</div>`,
checks:[
{q:'E°(Ag⁺/Ag) = +0.80 V, E°(Mg²⁺/Mg) = −2.37 V. What is E°cell for the spontaneous cell?',o:['+3.17 V','+1.57 V','−3.17 V','+3.97 V'],a:0,e:'E°cell = 0.80 − (−2.37) = +3.17 V.',w:['','You subtracted the wrong way round or mishandled the negative sign: 0.80 − (−2.37) = 0.80 + 2.37.','Reversed: cathode minus anode must be positive for the spontaneous cell.','You doubled the silver value — never multiply E° by coefficients.']},
{q:'E°(Pt²⁺/Pt) = +1.18 V and E°(Co²⁺/Co) = −0.28 V. Which electrode is the cathode?',o:['Pt','Co','Either','Neither'],a:0,e:'The half-cell with the higher reduction potential (Pt) is reduced → cathode. E°cell = +1.46 V.',w:['','Co has the lower E° → it is oxidized (anode).','The higher E° always decides.','Every cell has a cathode.']},
{q:'When balancing 2Ag⁺ + Cu → 2Ag + Cu²⁺, what happens to E°(Ag⁺/Ag) = +0.80 V?',o:['It stays +0.80 V','It becomes +1.60 V','It becomes −0.80 V','It becomes +0.40 V'],a:0,e:'E° does not depend on how many moles react — it is never multiplied.',w:['','Never multiply E° by coefficients.','The sign only changes in tables if written as oxidation, and the formula already handles that.','It is not divided either.']}
]});

L.push({
id:24, unit:'D', title:'Cell notation and overall equations',
outcome:'Write the cell notation and the overall chemical equation for a redox reaction occurring in a voltaic cell', ref:'Textbook + Example Problem 1 + practice + Table 3', pages:'31, 32, 33, 34',
fig:'notation',
html:`
<div class="key"><h4>Cell notation (line notation)</h4><div class="eq big">Anode | Anode ion ‖ Cathode ion | Cathode</div>
<ul><li><b>Anode on the LEFT</b> (oxidation), <b>cathode on the RIGHT</b> (reduction).</li>
<li><b>|</b> single line = phase boundary (solid | solution).</li><li><b>‖</b> double line = salt bridge.</li>
<li>Read left to right in the direction electrons flow.</li></ul>
<div class="eq">Zn(s) | Zn²⁺(aq) ‖ Cu²⁺(aq) | Cu(s)</div></div>
<div class="ex"><h5>Worked example: Al and Cu (E° Al³⁺/Al = −1.66 V, Cu²⁺/Cu = +0.34 V)</h5>
<ol><li>Cu higher → cathode; Al → anode.</li><li>Al → Al³⁺ + 3e⁻ (×2) &nbsp; Cu²⁺ + 2e⁻ → Cu (×3) → 6e⁻</li></ol>
<div class="eq good">2Al(s) + 3Cu²⁺(aq) → 2Al³⁺(aq) + 3Cu(s) &nbsp; E°cell = +2.00 V</div>
<div class="eq good">Al(s) | Al³⁺(aq) ‖ Cu²⁺(aq) | Cu(s)</div></div>
<div class="ex"><h5>With the SHE (inert Pt electrode)</h5><div class="eq">Zn(s) | Zn²⁺(aq) ‖ H⁺(aq) | H₂(g) | Pt(s)</div></div>`,
checks:[
{q:'Which notation represents the spontaneous Al–Cu cell?',o:['Al | Al³⁺ ‖ Cu²⁺ | Cu','Cu | Cu²⁺ ‖ Al³⁺ | Al','Al³⁺ | Al ‖ Cu | Cu²⁺','Cu²⁺ | Cu ‖ Al | Al³⁺'],a:0,e:'Anode (Al, oxidized) on the left; cathode (Cu²⁺ reduced) on the right.',w:['','This puts copper as the anode — non-spontaneous.','Order inside each half-cell is wrong: anode is written electrode | ion.','Completely reversed.']},
{q:'In cell notation, the double line ‖ represents…',o:['the salt bridge','the wire','a phase boundary','the voltmeter'],a:0,e:'‖ = salt bridge; | = phase boundary.',w:['','The wire is not shown in notation.','A single line | is a phase boundary.','The voltmeter is not shown.']},
{q:'Overall equation for Fe(s) | Fe²⁺(aq) ‖ Ag⁺(aq) | Ag(s)?',o:['Fe + 2Ag⁺ → Fe²⁺ + 2Ag','Fe²⁺ + 2Ag → Fe + 2Ag⁺','Fe + Ag⁺ → Fe²⁺ + Ag','2Fe + Ag⁺ → 2Fe²⁺ + Ag'],a:0,e:'Fe loses 2e⁻; each Ag⁺ gains 1e⁻ → 2Ag⁺.',w:['','Reversed — the anode (left) is oxidized.','Charge not balanced (0+1 ≠ 2+0).','Electrons not balanced.']}
]});

L.push({
id:25, unit:'D', title:'Testing spontaneity of a reaction as written',
outcome:'Use the half-cell standard reduction potentials to calculate the electrochemical cell standard potential, while determining whether the redox reactions are spontaneous or non-spontaneous', ref:'Textbook + practice + check your progress', pages:'34, 35',
html:`
<div class="key"><h4>Method for “Is this reaction spontaneous as written?”</h4>
<ol class="rules"><li>Identify what is <b>reduced</b> in the equation <b>as written</b> → that is the cathode (even if it has the lower E°!).</li>
<li>Identify what is <b>oxidized</b> → anode.</li>
<li>E°cell = E°cathode − E°anode.</li>
<li>Positive → <b>spontaneous</b>; negative → <b>non-spontaneous</b> (the reverse reaction is spontaneous).</li></ol></div>
<div class="ex"><h5>Worked example</h5><div class="eq">Cu(s) + Zn²⁺(aq) → Cu²⁺(aq) + Zn(s)</div>
<p>Zn²⁺ is reduced (cathode, −0.76 V); Cu is oxidized (anode, +0.34 V).</p>
<p>E°cell = −0.76 − 0.34 = <b>−1.10 V</b> → <b>non-spontaneous</b>. The reverse (Zn + Cu²⁺) is spontaneous with +1.10 V.</p></div>
<div class="tip">📌 Reversing a reaction reverses the sign of E°cell. That is why copper metal does NOT react with zinc sulfate solution, but zinc does react with copper sulfate.</div>`,
checks:[
{q:'Is Cu(s) + Zn²⁺(aq) → Cu²⁺(aq) + Zn(s) spontaneous? (Zn²⁺/Zn −0.76 V; Cu²⁺/Cu +0.34 V)',o:['No, E°cell = −1.10 V','Yes, E°cell = +1.10 V','Yes, E°cell = +0.42 V','No, E°cell = −0.42 V'],a:0,e:'As written Zn²⁺ is reduced: E°cell = −0.76 − 0.34 = −1.10 V → non-spontaneous.',w:['','+1.10 V is the reverse reaction.','You added the values incorrectly.','Wrong arithmetic: −0.76 − 0.34 = −1.10.']},
{q:'A reaction has E°cell = +1.217 V. If it is reversed, E°cell becomes…',o:['−1.217 V','+1.217 V','+2.434 V','0 V'],a:0,e:'Reversing the reaction reverses the sign.',w:['','The sign must change.','E° is not doubled.','It does not become zero.']},
{q:'Which reaction is NON-spontaneous under standard conditions?',o:['Fe²⁺ + Ni → Fe + Ni²⁺ (E° = −0.19 V)','Au³⁺ + Cu, E° = +1.16 V','Fe³⁺ + Mn, E° = +1.15 V','Cu²⁺ + Zn, E° = +1.10 V'],a:0,e:'A negative E°cell means non-spontaneous as written.',w:['','Positive E°cell → spontaneous.','Positive E°cell → spontaneous.','Positive E°cell → spontaneous.']}
]});

L.push({
id:26, unit:'E', title:'Voltaic vs electrolytic cells',
outcome:'Compare between electrolytic cell and voltaic cell in terms of identifying where will reduction and oxidation processes take place, anode, cathode, direction of electron flow and current flow and spontaneity of the reaction occurring', ref:'Figure 18 + textbook', pages:'47',
video:{id:'dRtSjJCKkIo', t:'Electrolysis — Tyler DeWitt'},
fig:'compare',
html:`
<table class="tbl cmp"><tr><th>Feature</th><th>⚡ Voltaic</th><th>🔌 Electrolytic</th></tr>
<tr><td>Energy</td><td>chemical → electrical</td><td>electrical → chemical</td></tr>
<tr><td>Spontaneity</td><td><b>spontaneous</b> (E°cell &gt; 0)</td><td><b>non-spontaneous</b> (needs power supply)</td></tr>
<tr><td>Oxidation at</td><td><b>anode</b></td><td><b>anode</b></td></tr>
<tr><td>Reduction at</td><td><b>cathode</b></td><td><b>cathode</b></td></tr>
<tr><td>Anode sign</td><td><b>negative (−)</b></td><td><b>positive (+)</b> — connected to + terminal</td></tr>
<tr><td>Cathode sign</td><td><b>positive (+)</b></td><td><b>negative (−)</b> — connected to − terminal</td></tr>
<tr><td>Electron flow (external)</td><td>anode → cathode</td><td>anode → (+) of battery … (−) of battery → cathode</td></tr>
<tr><td>Conventional current (external)</td><td>cathode → anode</td><td>opposite to electron flow</td></tr>
<tr><td>Salt bridge</td><td>needed (2 compartments)</td><td>usually one container</td></tr></table>
<div class="mnemo">🧠 What NEVER changes: <b>AN OX, RED CAT</b> (oxidation at anode, reduction at cathode) and electrons always flow <b>from the anode to the cathode</b> through the external circuit. What changes: the <b>signs</b> (+/−) and spontaneity.</div>`,
checks:[
{q:'Which statement is true in BOTH voltaic and electrolytic cells?',o:['Oxidation occurs at the anode','The anode is negative','The cathode is positive','The reaction is spontaneous'],a:0,e:'Oxidation is always at the anode, reduction always at the cathode; signs depend on the cell type.',w:['','The anode is positive in an electrolytic cell.','The cathode is negative in an electrolytic cell.','Electrolytic reactions are non-spontaneous.']},
{q:'In an electrolytic cell, the cathode is…',o:['negative, and reduction occurs there','positive, and reduction occurs there','negative, and oxidation occurs there','positive, and oxidation occurs there'],a:0,e:'The cathode is connected to the negative terminal; reduction (RED CAT) always occurs at the cathode.',w:['','Positive cathode is in a voltaic cell.','Oxidation is always at the anode.','Both parts wrong for an electrolytic cell.']},
{q:'Which process occurs in both voltaic and electrolytic cells?',o:['A redox reaction','A spontaneous reaction','A neutralization reaction','A non-spontaneous reaction'],a:0,e:'Both involve oxidation and reduction; they differ in spontaneity.',w:['','Only the voltaic cell is spontaneous.','No acid–base reaction is required.','Only the electrolytic cell is non-spontaneous.']}
]});

L.push({
id:27, unit:'E', title:'Reversing a spontaneous redox reaction',
outcome:'Describe how a spontaneous redox reaction of an electrochemical cell can be reversed', ref:'Figure 18 + textbook', pages:'47, 48',
fig:'reverse',
html:`
<p>A voltaic cell can be turned into an electrolytic cell by connecting an <b>external power source</b> whose voltage is <b>greater than E°cell</b> and that pushes electrons in the <b>opposite direction</b>.</p>
<div class="ex"><h5>Zn–Cu cell (E°cell = +1.10 V)</h5>
<p><b>Spontaneous:</b> Zn + Cu²⁺ → Zn²⁺ + Cu (Zn anode, Cu cathode)</p>
<p><b>Reversed with &gt; 1.10 V supply:</b> + terminal to Cu, − terminal to Zn</p>
<p>Cu is now the <b>anode</b>: Cu → Cu²⁺ + 2e⁻ (copper loses mass)<br>Zn is now the <b>cathode</b>: Zn²⁺ + 2e⁻ → Zn (zinc gains mass)</p>
<div class="eq good">Cu + Zn²⁺ → Cu²⁺ + Zn &nbsp;(non-spontaneous, driven by electricity)</div></div>
<div class="tip">📌 This is exactly what happens when you <b>recharge</b> a battery (e.g., lead–acid car battery, Li-ion phone battery).</div>
<div class="trap">⚠️ The anode/cathode labels <b>swap</b> when reversed, because the labels follow the reaction (oxidation/reduction), not the metal.</div>`,
checks:[
{q:'Which change drives a standard Zn–Cu voltaic cell (1.10 V) in reverse?',o:['An external supply greater than 1.10 V opposing the cell','A 0.50 V supply in the same direction','Removing the salt bridge','Replacing Cu with Zn'],a:0,e:'The applied voltage must exceed the cell voltage and push electrons the opposite way.',w:['','Too small, and in the wrong direction.','That just stops the cell.','That changes the cell, it does not reverse the reaction.']},
{q:'When the Zn–Cu cell is reversed, which electrode gains mass?',o:['Zn','Cu','Both','Neither'],a:0,e:'Zn²⁺ is now reduced onto the zinc electrode (now the cathode).',w:['','Cu is now oxidized → loses mass.','Cu loses mass.','Zn gains mass.']},
{q:'Which everyday process is an example of reversing a spontaneous cell reaction?',o:['Recharging a car or phone battery','Using a battery in a torch','Rusting of iron','Burning methane'],a:0,e:'Recharging uses electrical energy to drive the battery reaction backward.',w:['','That is the spontaneous (discharge) direction.','Rusting is spontaneous corrosion.','Combustion is spontaneous.']}
]});

L.push({
id:28, unit:'E', title:'Electrolysis of molten ionic compounds',
outcome:'Write half-cell reactions while identifying the products of electrolysis of molten ionic compounds', ref:'Figure 19 + textbook', pages:'48',
fig:'downs',
html:`
<p><b>Electrolysis</b> = using electrical energy to bring about a chemical reaction. In a <b>molten</b> salt there is <b>no water</b>, so the only ions are the metal cation and the anion.</p>
<div class="key"><h4>Rule for molten salts</h4><p>Cathode (−): <b>metal</b> is produced. Anode (+): <b>non-metal</b> is produced.</p></div>
<div class="ex"><h5>Down’s cell — molten NaCl (Figure 19)</h5>
<p>Cathode (reduction): <span class="eq-in">Na⁺(l) + e⁻ → Na(l)</span></p>
<p>Anode (oxidation): <span class="eq-in">2Cl⁻(l) → Cl₂(g) + 2e⁻</span></p>
<div class="eq good">2NaCl(l) → 2Na(l) + Cl₂(g)</div>
<p>Used industrially to produce sodium metal and chlorine gas. An iron screen keeps Na and Cl₂ apart (they would react back).</p></div>
<div class="ex"><h5>Other molten salts</h5>
<p>MgCl₂(l): cathode Mg²⁺ + 2e⁻ → Mg; anode 2Cl⁻ → Cl₂ + 2e⁻</p>
<p>PbBr₂(l): cathode Pb²⁺ + 2e⁻ → Pb; anode 2Br⁻ → Br₂ + 2e⁻</p></div>`,
checks:[
{q:'What forms at the cathode when molten NaCl is electrolyzed?',o:['Sodium metal','Chlorine gas','Hydrogen gas','Oxygen gas'],a:0,e:'Na⁺ + e⁻ → Na. No water is present to compete.',w:['','Cl₂ forms at the anode.','No water in the melt, so no H₂.','No water or oxide, so no O₂.']},
{q:'What is the anode half-reaction in a Down’s cell?',o:['2Cl⁻ → Cl₂ + 2e⁻','Cl₂ + 2e⁻ → 2Cl⁻','Na⁺ + e⁻ → Na','Na → Na⁺ + e⁻'],a:0,e:'Oxidation occurs at the anode: chloride loses electrons.',w:['','That is a reduction (electrons on left).','That is the cathode reaction.','Sodium metal is not present at the start; Na⁺ is reduced.']},
{q:'Products of electrolysis of molten MgCl₂?',o:['Mg and Cl₂','H₂ and Cl₂','Mg and O₂','H₂ and O₂'],a:0,e:'Molten salt: metal at the cathode, non-metal at the anode.',w:['','No water → no H₂.','No oxygen source in MgCl₂.','No water present.']}
]});

L.push({
id:29, unit:'E', title:'Electrolysis of aqueous ionic compounds',
outcome:'Write half-cell reactions while identifying the products of electrolysis of aqueous ionic compounds', ref:'Figure 20 + textbook', pages:'49',
fig:'brine',
html:`
<p>In <b>aqueous</b> solution, <b>water</b> can also be reduced or oxidized, so it competes with the ions.</p>
<div class="key"><h4>Water’s half-reactions</h4>
<p>At the cathode (reduction): <span class="eq-in">2H₂O(l) + 2e⁻ → H₂(g) + 2OH⁻(aq)</span></p>
<p>At the anode (oxidation): <span class="eq-in">2H₂O(l) → O₂(g) + 4H⁺(aq) + 4e⁻</span></p></div>
<div class="two"><div class="card c2"><h4>Cathode (−) — what is reduced?</h4><ul><li>Active metal ions (Group 1, Group 2, Al³⁺): <b>water is reduced → H₂</b></li><li>Less active metal ions (Cu²⁺, Ag⁺): <b>metal deposits</b></li></ul></div>
<div class="card c1"><h4>Anode (+) — what is oxidized?</h4><ul><li>Concentrated Cl⁻, Br⁻, I⁻: <b>halogen</b> forms</li><li>SO₄²⁻, NO₃⁻: <b>water is oxidized → O₂</b></li></ul></div></div>
<div class="ex"><h5>Brine — concentrated NaCl(aq) (Figure 20)</h5>
<p>Cathode: 2H₂O + 2e⁻ → H₂ + 2OH⁻ &nbsp; Anode: 2Cl⁻ → Cl₂ + 2e⁻</p>
<div class="eq good">2NaCl(aq) + 2H₂O(l) → H₂(g) + Cl₂(g) + 2NaOH(aq)</div>
<p>Three useful products: <b>hydrogen, chlorine and sodium hydroxide</b> (Na⁺ stays in solution with OH⁻).</p></div>
<div class="ex"><h5>Compare</h5><table class="tbl"><tr><th>Electrolyte</th><th>Cathode</th><th>Anode</th></tr>
<tr><td>NaCl (molten)</td><td>Na</td><td>Cl₂</td></tr><tr><td>NaCl (conc. aq)</td><td>H₂</td><td>Cl₂</td></tr>
<tr><td>KI (aq)</td><td>H₂</td><td>I₂</td></tr><tr><td>CuSO₄ (aq), inert electrodes</td><td>Cu</td><td>O₂</td></tr>
<tr><td>Na₂SO₄ (aq) / water</td><td>H₂</td><td>O₂</td></tr></table></div>`,
checks:[
{q:'Products when concentrated aqueous NaCl is electrolyzed with inert electrodes?',o:['H₂, Cl₂ and NaOH(aq)','Na, Cl₂ and H₂O','H₂, O₂ and NaCl(s)','Na and O₂'],a:0,e:'Water is reduced to H₂ + OH⁻; Cl⁻ oxidized to Cl₂; Na⁺ stays with OH⁻ → NaOH.',w:['','Na⁺ is not reduced in water — water is reduced instead.','Concentrated Cl⁻ gives Cl₂, not O₂.','Sodium metal cannot form in aqueous solution.']},
{q:'Cathode half-reaction in electrolysis of aqueous NaCl?',o:['2H₂O + 2e⁻ → H₂ + 2OH⁻','Na⁺ + e⁻ → Na','2Cl⁻ → Cl₂ + 2e⁻','2H₂O → O₂ + 4H⁺ + 4e⁻'],a:0,e:'Water is more easily reduced than Na⁺.',w:['','Na⁺ is much harder to reduce than water.','That is oxidation at the anode.','That is water oxidation (anode).']},
{q:'Electrolysis of aqueous CuSO₄ with inert electrodes produces…',o:['Cu at the cathode and O₂ at the anode','H₂ at the cathode and O₂ at the anode','Cu at the cathode and SO₂ at the anode','H₂ at the cathode and S at the anode'],a:0,e:'Cu²⁺ is easily reduced; sulfate is not oxidized, so water gives O₂.',w:['','Cu²⁺ is reduced in preference to water.','Sulfate is not oxidized in electrolysis.','Neither of these happens.']}
]});

L.push({
id:30, unit:'E', title:'Electroplating',
outcome:'Define electroplating while describing how it works, identifying anode, cathode and electrolyte needed for an electrolytic cell in which a selected metal is to be plated on an object (car or spoon,… etc)', ref:'Figure 22 + textbook', pages:'51, 52',
video:{id:'NClagKbLUMM', t:'Electroplating — Tyler DeWitt'},
fig:'plating',
html:`
<div class="key"><h4>Definition</h4><p><b>Electroplating</b> is the use of <b>electrolysis</b> to deposit a <b>thin layer of a metal</b> onto the surface of another object (for protection against corrosion or for appearance).</p></div>
<div class="key"><h4>The 3-part recipe</h4>
<table class="tbl"><tr><th>Part</th><th>What to use</th><th>Connected to</th></tr>
<tr><td><b>Cathode</b></td><td>the <b>object to be plated</b> (spoon, fork, car bumper)</td><td><b>negative</b> terminal</td></tr>
<tr><td><b>Anode</b></td><td>a bar of the <b>plating metal</b> (silver, chromium, copper…)</td><td><b>positive</b> terminal</td></tr>
<tr><td><b>Electrolyte</b></td><td>a solution containing <b>ions of the plating metal</b> (e.g., Ag⁺ / AgNO₃)</td><td>—</td></tr></table></div>
<div class="ex"><h5>Silver-plating a spoon (Figure 22)</h5>
<p>Anode: <span class="eq-in">Ag(s) → Ag⁺(aq) + e⁻</span> (silver bar dissolves)</p>
<p>Cathode: <span class="eq-in">Ag⁺(aq) + e⁻ → Ag(s)</span> (silver coats the spoon)</p>
<p>The Ag⁺ concentration stays constant: every Ag⁺ deposited is replaced by one from the anode.</p></div>
<div class="ex"><h5>Chrome-plating a car part</h5><p>Car bumper = cathode; chromium = anode (or inert anode); electrolyte containing Cr³⁺ ions (chromium compound). Cathode: Cr³⁺ + 3e⁻ → Cr.</p></div>
<div class="mnemo">🧠 <b>“Coat the Cathode”</b> — the object you want coated is always the <b>cathode</b> (−), because positive metal ions are attracted to it and reduced there.</div>`,
checks:[
{q:'When an iron fork is silver-plated, which part is the cathode?',o:['The iron fork','The silver bar','The electrolyte','The power supply'],a:0,e:'The object being plated is always the cathode, where Ag⁺ is reduced to Ag.',w:['','The silver bar is the anode (it dissolves).','The electrolyte is the solution of Ag⁺.','The power supply is the energy source, not an electrode.']},
{q:'In silver electroplating with a silver anode, which reaction occurs at the anode?',o:['Ag(s) → Ag⁺(aq) + e⁻','Ag⁺(aq) + e⁻ → Ag(s)','2H₂O → O₂ + 4H⁺ + 4e⁻','Fe → Fe²⁺ + 2e⁻'],a:0,e:'The silver anode is oxidized, replacing the Ag⁺ that is plated out.',w:['','That is the cathode (reduction) reaction.','The active silver anode is oxidized instead of water.','The fork is the cathode, so it is not oxidized.']},
{q:'Which electrolyte is needed to plate copper onto a key?',o:['A solution containing Cu²⁺ ions (e.g., CuSO₄)','A solution of NaCl','Pure distilled water','A solution containing Zn²⁺ ions'],a:0,e:'The electrolyte must contain ions of the plating metal.',w:['','NaCl gives no copper ions.','Pure water barely conducts and has no Cu²⁺.','Zn²⁺ would plate zinc, not copper.']}
]});

X(22,'The standard hydrogen electrode consists of…',['a platinum electrode in 1 M H⁺ with H₂ gas at 1 atm, 25 °C','a copper electrode in 1 M CuSO₄','a zinc electrode in 1 M H⁺','a platinum electrode in pure water with O₂ gas'],'Inert Pt, 1 M H⁺, H₂ at 1 atm, 25 °C, E° = 0.00 V.',['','That is a copper half-cell.','Zinc would react with acid.','Needs H⁺ and H₂, not water and O₂.']),

X(27,'To reverse the spontaneous reaction of a voltaic cell you need…',['an external power supply','a longer salt bridge','a catalyst','to cool the cell'],'Electrical energy drives the non-spontaneous reverse reaction.',['','The salt bridge only balances charge.','A catalyst cannot reverse a reaction.','Temperature alone will not reverse it.']),
X(28,'Molten KCl is electrolyzed. Which product forms at the anode?',['Cl₂','K','H₂','O₂'],'Anode (oxidation): 2Cl⁻ → Cl₂ + 2e⁻.',['','Potassium forms at the cathode.','No water present.','No oxygen present.']),
X(29,'Water containing a little sulfuric acid is electrolyzed. The products are…',['H₂ at the cathode and O₂ at the anode','O₂ at the cathode and H₂ at the anode','H₂ and SO₂','only H₂'],'Cathode: water/H⁺ reduced to H₂; anode: water oxidized to O₂ (2:1 volume).',['','Reversed electrodes.','Sulfate is not reduced to SO₂ here.','Oxygen also forms.']),
X(30,'Electroplating is…',['using electrolysis to deposit a thin layer of metal on an object','dipping an object in molten metal','painting a metal with a protective layer','using a voltaic cell to dissolve a metal'],'Electroplating is an application of electrolysis (electrolytic cell).',['','That is hot-dip galvanizing.','Painting is not electrochemical.','It uses an electrolytic, not voltaic, cell.'])
]});

EX.push({id:2, name:'Exam 2', level:'Hard', tag:'Standard', color:'#2563eb',
desc:'Typical exam difficulty: apply the rules to new reactions and calculate.',
qs:[
X(1,'In 2Fe₂O₃ + 3C → 4Fe + 3CO₂, which substance is oxidized because it GAINS oxygen?',['C','Fe₂O₃','Fe','CO₂'],'Carbon gains oxygen (C → CO₂) → oxidized. Fe₂O₃ loses oxygen → reduced.',['','Fe₂O₃ LOSES oxygen → reduced.','Fe is a product.','CO₂ is a product.']),
X(2,'Which statement about oxidation numbers is TRUE?',['They can be assigned to atoms in covalent molecules, not only to ions','They are always whole numbers','They equal the number of valence electrons','They are always positive for every element in a compound'],'Oxidation numbers are bookkeeping charges for any atom, e.g., C in CO₂ = +4.',['','Averages can be fractional (Fe in Fe₃O₄ = +8/3).','They depend on bonding, not valence electrons.','The more electronegative atom gets a negative number.']),
X(3,'Which statement is correct?',['The oxidizing agent is reduced and its oxidation number decreases','The oxidizing agent loses electrons','The reducing agent’s oxidation number decreases','A substance can be oxidized without another being reduced'],'Oxidizing agent: accepts e⁻, is reduced, number decreases.',['','It gains electrons.','The reducing agent’s number increases.','Oxidation and reduction always occur together.']),
X(4,'In 2Al + 3Cu²⁺ → 2Al³⁺ + 3Cu, how many electrons are transferred in total?',['6','3','2','5'],'2 Al × 3e⁻ = 6e⁻ lost; 3 Cu²⁺ × 2e⁻ = 6e⁻ gained.',['','That is for one Al atom.','That is for one Cu²⁺.','No combination gives 5.']),
X(5,'In SnCl₂ + 2FeCl₃ → SnCl₄ + 2FeCl₂, the reducing agent is…',['SnCl₂','FeCl₃','SnCl₄','FeCl₂'],'Sn: +2 → +4 (oxidized) → SnCl₂ is the reducing agent. Fe: +3 → +2.',['','FeCl₃ is reduced → oxidizing agent.','Product.','Product.']),
X(6,'Which change is an OXIDATION?',['Cr³⁺ → CrO₄²⁻','MnO₄⁻ → Mn²⁺','Cl₂ → Cl⁻','Fe³⁺ → Fe²⁺'],'Cr: +3 → +6 (increase).',['','Mn: +7 → +2 (reduction).','Cl: 0 → −1 (reduction).','Fe: +3 → +2 (reduction).']),
X(7,'Which list is in order of INCREASING oxidation number of chlorine?',['HCl, Cl₂, HClO, HClO₄','HClO₄, HClO, Cl₂, HCl','Cl₂, HCl, HClO, HClO₄','HCl, HClO, Cl₂, HClO₄'],'HCl −1, Cl₂ 0, HClO +1, HClO₄ +7.',['','This is decreasing order.','HCl (−1) is lower than Cl₂ (0).','HClO (+1) is higher than Cl₂ (0).']),
X(8,'What is the oxidation number of O in sodium peroxide, Na₂O₂?',['−1','−2','+1','0'],'2(+1) + 2x = 0 → x = −1 (peroxide).',['','−2 is normal oxide, not peroxide.','O is more electronegative than Na → negative.','O is combined.']),
X(9,'What is the oxidation number of C in Na₂C₂O₄?',['+3','+4','+2','+6'],'2(+1) + 2x + 4(−2) = 0 → 2x = 6 → x = +3.',['','+4 is C in CO₂.','+2 is C in CO.','+6 is the total for both C atoms.']),
X(10,'In 3NO₂ + H₂O → 2HNO₃ + NO, nitrogen is…',['both oxidized (to +5) and reduced (to +2)','only oxidized','only reduced','neither oxidized nor reduced'],'N is +4 in NO₂, +5 in HNO₃ and +2 in NO: disproportionation.',['','It is also reduced to NO.','It is also oxidized to HNO₃.','N changes from +4.']),
X(11,'In Cl₂ + 2KBr → 2KCl + Br₂, which statement is correct?',['Cl₂ is reduced; K⁺ is a spectator','Br⁻ is reduced; K⁺ is oxidized','Cl₂ is oxidized; Br⁻ is reduced','K⁺ is reduced to K'],'Cl: 0 → −1 (reduced); Br: −1 → 0 (oxidized); K stays +1.',['','Br⁻ is oxidized; K⁺ unchanged.','Reversed.','K⁺ stays +1.']),
X(12,'Balancing MnO₄⁻ → Mn²⁺ in acidic solution, how many H₂O molecules are added, and on which side?',['4, on the product side','4, on the reactant side','8, on the product side','2, on the product side'],'4 O atoms in MnO₄⁻ → add 4H₂O to the right; then 8H⁺ on the left.',['','Water goes where oxygen is missing (the right).','8 is the number of H⁺.','There are 4 oxygen atoms to balance.']),
X(13,'Which is the oxidation half-reaction for 2Al + 3Cl₂ → 2AlCl₃?',['Al → Al³⁺ + 3e⁻','Cl₂ + 2e⁻ → 2Cl⁻','Al³⁺ + 3e⁻ → Al','2Cl⁻ → Cl₂ + 2e⁻'],'Al loses 3e⁻ (0 → +3).',['','That is the reduction half.','Reverse of what happens.','Chloride is formed, not oxidized.']),
X(14,'Balance in acid: 2MnO₄⁻ + 5H₂C₂O₄ + _H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O',['6','16','10','8'],'H: 10 (from H₂C₂O₄) + x = 16 (in 8H₂O) → x = 6. Charge: −2 + 6 = +4 = 2(+2) ✔',['','16 forgets the H already in oxalic acid.','10 does not balance H or charge.','8 does not balance H.']),
X(15,'For Cr₂O₇²⁻ + Fe²⁺ → Cr³⁺ + Fe³⁺ in acid, the coefficients of H⁺ and Fe²⁺ are…',['14 and 6','7 and 1','14 and 3','6 and 14'],'Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O; 6 Fe²⁺ supply 6e⁻.',['','7 is the water coefficient.','3 would only supply 3e⁻.','Reversed.']),
X(16,'Which is the correctly balanced half-reaction for Ag₂O₃ → AgO in BASIC solution?',['Ag₂O₃ + H₂O + 2e⁻ → 2AgO + 2OH⁻','Ag₂O₃ + 2H⁺ + 2e⁻ → 2AgO + H₂O','Ag₂O₃ → 2AgO + O²⁻','Ag₂O₃ + 2OH⁻ → 2AgO + H₂O + 2e⁻'],'Acid form: Ag₂O₃ + 2H⁺ + 2e⁻ → 2AgO + H₂O; add 2OH⁻ both sides and cancel one H₂O.',['','That is the ACIDIC form.','O²⁻ does not exist free in water.','Ag is reduced (+3 → +2), so electrons must be on the left.']),
X(17,'Balanced in base: 2MnO₄⁻ + I⁻ + H₂O → 2MnO₂ + IO₃⁻ + _OH⁻',['2','1','4','6'],'H: 2 = 2; charge: −3 = −1 + (−2) ✔.',['','Charge −3 ≠ −2.','Charge −3 ≠ −5.','Charge −3 ≠ −7.']),
X(18,'Which of the following is NOT a voltaic cell?',['A cell used to electrolyze molten NaCl','A car battery while it starts the engine','A dry cell in a flashlight','A Zn–Cu Daniell cell'],'Electrolysis uses electrical energy → electrolytic cell.',['','Discharging battery = voltaic.','Dry cell = voltaic.','Daniell cell = voltaic.']),
X(19,'What happens if the salt bridge is removed from a working Zn–Cu cell?',['The current stops because the circuit is broken and charge builds up','Electrons flow faster','Electrons flow through the solution instead','The voltage doubles'],'Without ion flow, half-cells become charged and the circuit is incomplete.',['','Flow stops, not speeds up.','Electrons cannot travel through solution.','The voltage drops to zero.']),
X(20,'A voltaic cell is made of Ni²⁺/Ni (−0.26 V) and Ag⁺/Ag (+0.80 V). The anode half-reaction is…',['Ni → Ni²⁺ + 2e⁻','Ag → Ag⁺ + e⁻','Ag⁺ + e⁻ → Ag','Ni²⁺ + 2e⁻ → Ni'],'Lower E° (Ni) is oxidized at the anode.',['','Ag has the higher E° → reduced.','That is the cathode reaction.','That is reduction.']),
X(21,'Which metal is the strongest reducing agent? Mg²⁺/Mg −2.37 V; Zn²⁺/Zn −0.76 V; Fe²⁺/Fe −0.45 V; Cu²⁺/Cu +0.34 V',['Mg','Zn','Fe','Cu'],'Most negative E° → most easily oxidized → strongest reducing agent.',['','Less negative than Mg.','Less negative than Mg.','Cu is the weakest reducing agent here.']),
X(22,'The SHE is connected to a Zn²⁺/Zn half-cell (−0.76 V). What happens at the SHE?',['2H⁺ + 2e⁻ → H₂ (cathode)','H₂ → 2H⁺ + 2e⁻ (anode)','Zn²⁺ is reduced on platinum','Nothing — it is a reference'],'Zn has the lower E° → anode; the SHE is the cathode where H⁺ is reduced.',['','The SHE is the anode only against positive E° half-cells.','Zn²⁺ is not reduced; Zn is oxidized.','The reference still reacts.']),
X(23,'E°(Ni²⁺/Ni) = −0.26 V, E°(Ag⁺/Ag) = +0.80 V. What is E°cell?',['+1.06 V','+0.54 V','−1.06 V','+1.86 V'],'0.80 − (−0.26) = +1.06 V.',['','You did 0.80 − 0.26.','Reversed sign.','You doubled silver’s E° (never multiply E°).']),
X(24,'Which is the correct cell notation for the Ni–Ag cell?',['Ni(s) | Ni²⁺(aq) ‖ Ag⁺(aq) | Ag(s)','Ag(s) | Ag⁺(aq) ‖ Ni²⁺(aq) | Ni(s)','Ni²⁺(aq) | Ni(s) ‖ Ag(s) | Ag⁺(aq)','Ni(s) ‖ Ni²⁺(aq) | Ag⁺(aq) ‖ Ag(s)'],'Anode (Ni) on the left, cathode (Ag) on the right.',['','Silver would be the anode → non-spontaneous.','Electrode/ion order wrong.','Single and double lines used wrongly.']),
X(25,'Will copper metal react with silver ions? Cu + 2Ag⁺ → Cu²⁺ + 2Ag (Cu²⁺/Cu +0.34 V; Ag⁺/Ag +0.80 V)',['Yes, E°cell = +0.46 V','No, E°cell = −0.46 V','Yes, E°cell = +1.14 V','No, E°cell = −1.14 V'],'Ag⁺ reduced (cathode): 0.80 − 0.34 = +0.46 V → spontaneous.',['','Sign reversed.','You added the potentials.','Wrong in sign and value.']),
X(26,'In an electrolytic cell, electrons enter the cell at the…',['cathode, from the negative terminal of the power supply','anode, from the positive terminal','cathode, from the positive terminal','salt bridge'],'The − terminal pushes electrons into the cathode, where reduction occurs.',['','Electrons LEAVE the anode toward the + terminal.','The cathode is connected to the − terminal.','Electrons never move through ions/bridges.']),
X(27,'What is the minimum external voltage needed to reverse a standard Ni–Ag cell (E°cell = 1.06 V)?',['Greater than 1.06 V','0.53 V','Exactly 0 V','Any voltage in the same direction'],'The supply must overcome the cell’s own voltage.',['','Too small.','No reversal at zero.','It must OPPOSE the cell.']),
X(28,'Aluminium is produced by electrolysis of molten Al₂O₃. The cathode half-reaction is…',['Al³⁺ + 3e⁻ → Al','Al → Al³⁺ + 3e⁻','2O²⁻ → O₂ + 4e⁻','O₂ + 4e⁻ → 2O²⁻'],'Molten salt: metal ion reduced at the cathode.',['','That is oxidation.','That is the anode reaction.','O₂ is formed, not consumed.']),
X(29,'Aqueous KI is electrolyzed with inert electrodes. Products at cathode and anode are…',['H₂ and I₂','K and I₂','H₂ and O₂','K and O₂'],'K⁺ is too hard to reduce → water gives H₂; I⁻ is oxidized to I₂.',['','K cannot form in water.','Iodide is oxidized before water.','Neither forms.']),
X(30,'A car bumper is chrome-plated. The bumper is…',['the cathode, connected to the negative terminal','the anode, connected to the positive terminal','the cathode, connected to the positive terminal','the electrolyte'],'The object to be plated is always the cathode, where Cr³⁺ is reduced.',['','The chromium source is the anode.','Cathode = negative in electrolysis.','The electrolyte is the solution of chromium ions.'])

X(7,'In which pair does chlorine have the SAME oxidation number?',['HClO₄ and Cl₂O₇','ClO₂ and ClO₂⁻','NaClO and NaClO₂','Cl₂O and ClO₃⁻'],'HClO₄: +7; Cl₂O₇: 2x − 14 = 0 → +7.',['','ClO₂: +4; ClO₂⁻: +3.','+1 and +3.','+1 and +5.']),
X(8,'In which compound is hydrogen assigned −1?',['LiAlH₄','NH₃','H₂O','HCl'],'LiAlH₄ is a metal hydride: +1 + 3 + 4x = 0 → x = −1.',['','H is +1 (N more electronegative).','H is +1.','H is +1.']),
X(9,'What is the oxidation number of C in glucose, C₆H₁₂O₆?',['0','+4','−4','+6'],'6x + 12(+1) + 6(−2) = 0 → x = 0 (average).',['','+4 is C in CO₂.','−4 is C in CH₄.','No.']),

X(12,'Which half-reaction is correctly balanced in ACIDIC solution?',['SO₄²⁻ + 4H⁺ + 2e⁻ → SO₂ + 2H₂O','SO₄²⁻ + 2H⁺ + 2e⁻ → SO₂ + H₂O','SO₄²⁻ + 4H⁺ → SO₂ + 2H₂O + 2e⁻','SO₄²⁻ + 4H⁺ + 4e⁻ → SO₂ + 2H₂O'],'O: 4 = 2 + 2 ✔; H: 4 = 4 ✔; charge: −2 + 4 − 2 = 0 ✔.',['','O not balanced (4 vs 3).','Reduction needs electrons on the left; charge fails.','Charge: −2 + 4 − 4 = −2 ≠ 0.']),
X(13,'For 2MnO₄⁻ + 5SO₂ + 2H₂O → 2Mn²⁺ + 5SO₄²⁻ + 4H⁺, the oxidation half-reaction is…',['SO₂ + 2H₂O → SO₄²⁻ + 4H⁺ + 2e⁻','MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O','SO₄²⁻ + 4H⁺ + 2e⁻ → SO₂ + 2H₂O','SO₂ + O₂ → SO₄²⁻'],'S: +4 → +6, loses 2e⁻.',['','That is the reduction half.','That is the reverse (reduction).','Not a balanced half-reaction.']),
X(14,'Balance in acid: _Zn + NO₃⁻ + 10H⁺ → _Zn²⁺ + NH₄⁺ + 3H₂O. The Zn coefficient is…',['4','2','8','1'],'N: +5 → −3 = 8e⁻ gained; each Zn gives 2e⁻ → 4 Zn. Charge: −1 + 10 = 9 = 8 + 1 ✔',['','Only 4e⁻ supplied.','16e⁻ — too many.','Only 2e⁻.']),
X(15,'Balance in acid: _H₂O₂ + 2MnO₄⁻ + _H⁺ → 5O₂ + 2Mn²⁺ + 8H₂O. The coefficients of H₂O₂ and H⁺ are…',['5 and 6','5 and 16','2 and 6','5 and 8'],'H₂O₂ → O₂ + 2H⁺ + 2e⁻ (×5); MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O (×2). Net H⁺: 16 − 10 = 6.',['','Forgot that H₂O₂ releases 10 H⁺ that cancel.','H₂O₂ must match 5 O₂.','8 is the water coefficient.']),
X(16,'The acidic equation ClO₃⁻ + 3SO₂ + 3H₂O → Cl⁻ + 3SO₄²⁻ + 6H⁺ is converted to BASIC solution. The result is…',['ClO₃⁻ + 3SO₂ + 6OH⁻ → Cl⁻ + 3SO₄²⁻ + 3H₂O','ClO₃⁻ + 3SO₂ + 3H₂O + 6OH⁻ → Cl⁻ + 3SO₄²⁻ + 6H₂O','ClO₃⁻ + 3SO₂ → Cl⁻ + 3SO₄²⁻ + 6OH⁻','ClO₃⁻ + 3SO₂ + 3OH⁻ → Cl⁻ + 3SO₄²⁻ + 3H⁺'],'Add 6OH⁻ both sides → 6H₂O on right; cancel 3H₂O.',['','Correct idea but waters not cancelled.','O, H and charge not balanced.','H⁺ cannot remain in base.']),
X(17,'Balanced in base: 2Cr(OH)₃ + ClO₃⁻ + 4OH⁻ → 2CrO₄²⁻ + Cl⁻ + _H₂O',['5','4','3','7'],'H: 6 + 4 = 10 → 5H₂O. O: 6 + 3 + 4 = 13 = 8 + 5 ✔',['','H: 10 ≠ 8.','H: 10 ≠ 6.','H: 10 ≠ 14.']),
X(18,'Which statement explains why the anode of a voltaic cell is NEGATIVE?',['Oxidation releases electrons there, so electrons accumulate on it','Cations are attracted to it','It is connected to the negative terminal of a battery','Reduction occurs there'],'Electrons are produced at the anode, giving it a negative charge.',['','Cations move toward the cathode.','That describes an electrolytic cathode.','Reduction is at the cathode.']),
X(19,'In Mg | Mg²⁺ ‖ Ag⁺ | Ag with a KNO₃ salt bridge, the NO₃⁻ ions move…',['toward the Mg half-cell','toward the Ag half-cell','into the wire','they do not move'],'Mg²⁺ forms at the anode (excess + charge) → anions move there.',['','K⁺ ions move toward the Ag (cathode) side.','Ions never enter the wire.','Ion movement keeps the cell working.']),
X(20,'A voltaic cell uses Al³⁺/Al (−1.66 V) and Ni²⁺/Ni (−0.26 V). The overall reaction is…',['2Al + 3Ni²⁺ → 2Al³⁺ + 3Ni','3Ni + 2Al³⁺ → 3Ni²⁺ + 2Al','Al + Ni²⁺ → Al³⁺ + Ni','2Al + 3Ni → 2Al³⁺ + 3Ni²⁺'],'Al (lower E°) oxidized; Ni²⁺ reduced; 6e⁻ balance.',['','Non-spontaneous direction.','Charge not balanced (+2 vs +3).','Both oxidized — impossible.']),
X(21,'E°: X²⁺/X = −0.40 V, Y²⁺/Y = +0.15 V, Z²⁺/Z = −1.20 V. Which metal is the strongest reducing agent?',['Z','X','Y','All equal'],'Most negative E° → most easily oxidized.',['','X is weaker than Z.','Y is the weakest reducing agent.','Different E° values.']),
X(22,'A metal M is connected to the SHE. The voltmeter reads 0.44 V and M is the anode. E°(M²⁺/M) is…',['−0.44 V','+0.44 V','0.00 V','+0.88 V'],'E°cell = E°cathode − E°anode → 0.44 = 0 − E°(M) → E°(M) = −0.44 V.',['','If M were the cathode it would be +0.44 V.','That is the SHE.','No doubling.']),
X(23,'E°(Au³⁺/Au) = +1.50 V, E°(Cr³⁺/Cr) = −0.74 V. E°cell for the spontaneous cell is…',['+2.24 V','+0.76 V','−2.24 V','+4.48 V'],'1.50 − (−0.74) = +2.24 V.',['','You did 1.50 − 0.74.','Wrong sign.','Never multiply E°.']),
X(24,'For Pb(s) | Pb²⁺(aq) ‖ Ag⁺(aq) | Ag(s), the overall reaction is…',['Pb + 2Ag⁺ → Pb²⁺ + 2Ag','Pb²⁺ + 2Ag → Pb + 2Ag⁺','Pb + Ag⁺ → Pb²⁺ + Ag','2Pb + Ag⁺ → 2Pb²⁺ + Ag'],'Left (anode) oxidized: Pb → Pb²⁺ + 2e⁻; right reduced: 2Ag⁺ + 2e⁻ → 2Ag.',['','Reversed.','Charge unbalanced.','Charge and electrons unbalanced.']),
X(25,'Which metal will NOT react with 1 M HCl to release H₂? (E°: Mg −2.37, Zn −0.76, Fe −0.45, Cu +0.34 V)',['Cu','Zn','Mg','Fe'],'For M + 2H⁺: E°cell = 0 − E°(M). Only Cu gives a negative value (−0.34 V).',['','Zn: +0.76 V → reacts.','Mg: +2.37 V → reacts.','Fe: +0.45 V → reacts.']),
X(26,'In an electrolytic cell, the electrode connected to the POSITIVE terminal is the…',['anode, where oxidation occurs','cathode, where reduction occurs','anode, where reduction occurs','cathode, where oxidation occurs'],'Positive terminal pulls electrons out of the anode → oxidation.',['','The cathode is connected to the negative terminal.','Reduction never occurs at the anode.','Wrong on both counts.']),
X(27,'When a lead–acid car battery is RECHARGED…',['it acts as an electrolytic cell driving a non-spontaneous reaction','it acts as a voltaic cell producing energy','the anode and cathode keep the same reactions','no redox reaction occurs'],'Recharging forces the discharge reaction backward using electrical energy.',['','That is discharging.','The reactions reverse, so the electrode roles swap.','Recharging is redox.']),
X(28,'Molten PbBr₂ is electrolyzed. Which pair of half-reactions is correct?',['Cathode: Pb²⁺ + 2e⁻ → Pb; Anode: 2Br⁻ → Br₂ + 2e⁻','Cathode: 2Br⁻ → Br₂ + 2e⁻; Anode: Pb²⁺ + 2e⁻ → Pb','Cathode: 2H₂O + 2e⁻ → H₂ + 2OH⁻; Anode: 2Br⁻ → Br₂ + 2e⁻','Cathode: Pb → Pb²⁺ + 2e⁻; Anode: Br₂ + 2e⁻ → 2Br⁻'],'Molten: metal at cathode, non-metal at anode.',['','Swapped electrodes.','No water in a melt.','Both reversed.']),
X(29,'Aqueous Na₂SO₄ is electrolyzed with inert electrodes. What forms?',['H₂ at the cathode and O₂ at the anode','Na at the cathode and SO₂ at the anode','H₂ at the cathode and S at the anode','Na at the cathode and O₂ at the anode'],'Neither Na⁺ nor SO₄²⁻ reacts; water is reduced and oxidized. Na₂SO₄ only improves conductivity.',['','Na⁺ is not reduced in water; sulfate is not oxidized.','Sulfate is not reduced at the anode.','Na cannot form in water.']),
X(30,'A key is copper-plated using a copper anode and CuSO₄(aq). During plating, the Cu²⁺ concentration…',['stays about the same','increases steadily','decreases to zero','turns into Cu⁺'],'Cu²⁺ removed at the cathode is replaced by Cu²⁺ formed at the copper anode.',['','Equal rates of formation and removal.','The anode keeps supplying Cu²⁺.','Cu²⁺ is reduced to Cu metal, not Cu⁺.'])
]});

EX.push({id:4, name:'Exam 4', level:'Very Hard', tag:'Expert', color:'#dc2626',
desc:'Deep understanding: disproportionation, unusual oxidation numbers, reverse-engineering E° values.',
qs:[
X(1,'In 2Na + 2H₂O → 2NaOH + H₂, which statement is correct?',['Na is oxidized and the hydrogen in water is reduced','Na gains hydrogen and is reduced','Oxygen is oxidized','It is not a redox reaction'],'Na: 0 → +1; H: +1 (H₂O) → 0 (H₂). O stays −2.',['','Na ends as Na⁺ in NaOH → oxidized.','O stays −2.','Oxidation numbers change.']),
X(2,'Iron in Fe₃O₄ is assigned +8/3. This fractional value means…',['it is an AVERAGE of Fe atoms in different oxidation states (+2 and +3)','one Fe atom has lost 8/3 electrons','the rules cannot be applied','Fe₃O₄ is not a real compound'],'Fe₃O₄ = FeO·Fe₂O₃: one Fe²⁺ and two Fe³⁺ → average (2 + 6)/3 = +8/3.',['','Electrons cannot be split into thirds per atom.','The rules work — they give an average.','Fe₃O₄ is magnetite.']),
X(3,'The reaction Br₂ + 2I⁻ → 2Br⁻ + I₂ is spontaneous. Which conclusion is correct?',['Br₂ is a stronger oxidizing agent than I₂','I₂ is a stronger oxidizing agent than Br₂','Br⁻ is a stronger reducing agent than I⁻','Br₂ is oxidized'],'The stronger oxidizing agent (Br₂) takes electrons from the reduced form of the weaker one (I⁻).',['','Then I₂ would oxidize Br⁻ instead.','I⁻ is the stronger reducing agent (it is oxidized).','Br₂ is reduced (0 → −1).']),
X(4,'In 2KMnO₄ + 5H₂O₂ + 3H₂SO₄ → K₂SO₄ + 2MnSO₄ + 5O₂ + 8H₂O, identify the agents.',['Oxidizing agent KMnO₄; reducing agent H₂O₂','Oxidizing agent H₂O₂; reducing agent KMnO₄','Oxidizing agent H₂SO₄; reducing agent H₂O₂','Oxidizing agent KMnO₄; reducing agent H₂SO₄'],'Mn: +7 → +2 (reduced). O in H₂O₂: −1 → 0 in O₂ (oxidized).',['','Here H₂O₂ is oxidized to O₂ — it is the reducing agent.','S stays +6.','S stays +6.']),
X(5,'In 2H₂O₂ → 2H₂O + O₂, hydrogen peroxide acts as…',['both the oxidizing agent and the reducing agent','only the oxidizing agent','only the reducing agent','neither — it is not redox'],'O: −1 → −2 (in H₂O, reduced) and −1 → 0 (in O₂, oxidized): disproportionation.',['','It is also oxidized.','It is also reduced.','Oxidation numbers of O change.']),
X(6,'How many electrons are transferred in 2MnO₄⁻ + 10Cl⁻ + 16H⁺ → 2Mn²⁺ + 5Cl₂ + 8H₂O?',['10','5','2','16'],'2 Mn × 5e⁻ = 10e⁻ = 10 Cl⁻ × 1e⁻.',['','For one Mn only.','Count again.','16 is the H⁺ coefficient.']),
X(7,'In which pair does nitrogen have the SAME oxidation number?',['NO₂ and N₂O₄','NH₃ and N₂H₄','NO and N₂O','HNO₂ and HNO₃'],'Both +4.',['','−3 and −2.','+2 and +1.','+3 and +5.']),
X(8,'What is the average oxidation number of S in the tetrathionate ion, S₄O₆²⁻?',['+2.5','+2','+3','+5'],'4x + 6(−2) = −2 → 4x = 10 → x = +2.5.',['','4(2) − 12 = −4 ≠ −2.','4(3) − 12 = 0 ≠ −2.','Way too high.']),
X(9,'In ammonium dichromate, (NH₄)₂Cr₂O₇, the oxidation numbers of N and Cr are…',['N = −3, Cr = +6','N = +3, Cr = +6','N = −3, Cr = +7','N = +5, Cr = +3'],'NH₄⁺: x + 4 = +1 → −3. Cr₂O₇²⁻: 2y − 14 = −2 → +6.',['','N must be negative (bonded to H).','Cr: 2(7) − 14 = 0 ≠ −2.','Both wrong.']),
X(10,'In 4FeS₂ + 11O₂ → 2Fe₂O₃ + 8SO₂, which elements are oxidized?',['Both Fe and S','Only Fe','Only S','Only O'],'Fe: +2 → +3; S: −1 (in S₂²⁻) → +4. Oxygen is reduced (0 → −2).',['','S is also oxidized.','Fe is also oxidized.','O is reduced.']),
X(11,'In 3Cl₂ + 6OH⁻ → 5Cl⁻ + ClO₃⁻ + 3H₂O, what is the ratio of Cl atoms REDUCED to Cl atoms OXIDIZED?',['5 : 1','1 : 5','3 : 1','1 : 1'],'5 Cl go 0 → −1 (gain 5e⁻); 1 Cl goes 0 → +5 (loses 5e⁻).',['','Reversed.','Count the products: 5 Cl⁻ and 1 ClO₃⁻.','Electron balance requires 5:1.']),
X(12,'A student writes MnO₄⁻ + 8H⁺ + 3e⁻ → Mn²⁺ + 4H₂O. What is wrong?',['Charge is not balanced — it needs 5e⁻','Oxygen is not balanced','Hydrogen is not balanced','Nothing — it is correct'],'Left: −1 + 8 − 3 = +4 ≠ +2. With 5e⁻: +2 = +2.',['','4 O on both sides.','8 H on both sides.','Charge check fails.']),
X(13,'For 2Cr₂O₇²⁻ + 3C₂H₅OH → 4Cr³⁺ + 3CH₃COOH (acid), the oxidation half-reaction is…',['C₂H₅OH + H₂O → CH₃COOH + 4H⁺ + 4e⁻','C₂H₅OH → CH₃COOH + 2H⁺ + 2e⁻','C₂H₅OH + 4H⁺ + 4e⁻ → CH₃COOH + H₂O','C₂H₅OH + O₂ → CH₃COOH + H₂O'],'C₂H₆O + H₂O → C₂H₄O₂ + 4H⁺ + 4e⁻: O 2 = 2, H 8 = 8, charge 0 = 0.',['','O not balanced (1 vs 2).','Electrons on the wrong side for oxidation.','Not a half-reaction.']),
X(14,'2Cr₂O₇²⁻ + 3C₂H₅OH + _H⁺ → 4Cr³⁺ + 3CH₃COOH + 11H₂O. The H⁺ coefficient is…',['16','28','12','8'],'Charge: −4 + x = +12 → x = 16. (H: 18 + 16 = 12 + 22 ✔)',['','28 = 2 × 14 without cancelling the H⁺ released by ethanol.','Charge would be +8.','Charge would be +4.']),
X(15,'Balance in acid: 5PbO₂ + 2Mn²⁺ + 4H⁺ → 5Pb²⁺ + 2MnO₄⁻ + _H₂O. The water term is…',['2H₂O on the product side','4H₂O on the product side','2H₂O on the reactant side','No water is needed'],'O: 10 = 8 + 2; H: 4 = 4.',['','H would be 8 ≠ 4.','O is needed on the product side.','O does not balance without water.']),
X(16,'Balanced in base: 4Zn + NO₃⁻ + _OH⁻ + 6H₂O → 4Zn(OH)₄²⁻ + NH₃',['7','4','8','6'],'Charge: −1 − x = −8 → x = 7. H: 7 + 12 = 16 + 3 ✔',['','Charge −5 ≠ −8.','Charge −9 ≠ −8.','Charge −7 ≠ −8.']),
X(17,'Which equation is correctly balanced in BASIC solution?',['3CN⁻ + 2MnO₄⁻ + H₂O → 3CNO⁻ + 2MnO₂ + 2OH⁻','3CN⁻ + 2MnO₄⁻ + 2H⁺ → 3CNO⁻ + 2MnO₂ + H₂O','CN⁻ + MnO₄⁻ → CNO⁻ + MnO₂ + O₂','3CN⁻ + 2MnO₄⁻ → 3CNO⁻ + 2MnO₂ + 2O²⁻'],'O: 8 + 1 = 3 + 4 + 2 ✔; H: 2 = 2 ✔; charge −5 = −5 ✔.',['','Acidic form — H⁺ is not allowed in base.','Not balanced; O₂ is not a product.','Free O²⁻ does not exist in water.']),
X(18,'Which statement about a voltaic cell is FALSE?',['The cathode is negative because it attracts cations','Electrons flow from anode to cathode in the external circuit','E°cell is positive','Chemical energy is converted to electrical energy'],'In a voltaic cell the cathode is POSITIVE (electrons are consumed there).',['','True.','True — spontaneous.','True.']),
X(19,'Cu | Cu²⁺ ‖ Ag⁺ | Ag operates for some time. Which observation is expected?',['Cu electrode mass decreases, [Cu²⁺] increases, Ag electrode mass increases','Cu electrode mass increases, [Ag⁺] increases','Both electrodes lose mass','[Cu²⁺] decreases and Ag dissolves'],'Cu is oxidized to Cu²⁺; Ag⁺ is reduced onto the Ag cathode.',['','Reverse of what happens.','Silver deposits — gains mass.','Opposite of what happens.']),
X(20,'A cell combines Fe³⁺/Fe²⁺ (+0.77 V, Pt electrode) with Cu²⁺/Cu (+0.34 V). The cathode reaction is…',['Fe³⁺ + e⁻ → Fe²⁺','Cu²⁺ + 2e⁻ → Cu','Fe²⁺ → Fe³⁺ + e⁻','Pt → Pt²⁺ + 2e⁻'],'Higher E° (Fe³⁺/Fe²⁺) is reduced at the inert Pt cathode; Cu is the anode.',['','Cu²⁺/Cu has the lower E° → anode (Cu oxidized).','That is oxidation.','Pt is inert — it only conducts.']),
X(21,'Which species can oxidize Fe²⁺ to Fe³⁺ (+0.77 V) but CANNOT oxidize Cl⁻ to Cl₂ (+1.36 V)?',['Br₂ (+1.07 V)','I₂ (+0.54 V)','F₂ (+2.87 V)','Cu²⁺ (+0.34 V)'],'Its E° must lie between +0.77 and +1.36 V.',['','Too weak to oxidize Fe²⁺.','Strong enough to oxidize Cl⁻ as well.','Too weak.']),
X(22,'If the reference were changed so that E°(Cu²⁺/Cu) = 0.00 V, then…',['every E° would shift by −0.34 V but all E°cell values stay the same','all E°cell values would change by 0.34 V','the SHE would still be 0.00 V','zinc would become a better oxidizing agent'],'E°cell is a difference, so shifting the zero does not change it. SHE would be −0.34 V.',['','Differences are unaffected.','The SHE would become −0.34 V.','Relative strengths do not change.']),
X(23,'E°(Al³⁺/Al) = −1.66 V, E°(Ag⁺/Ag) = +0.80 V. E°cell for the spontaneous cell is…',['+2.46 V','+0.86 V','+4.06 V','−2.46 V'],'0.80 − (−1.66) = +2.46 V. Coefficients (3Ag⁺) do NOT multiply E°.',['','You did 1.66 − 0.80.','You tripled the silver potential.','Sign reversed.']),
X(24,'Correct notation for Zn + 2Fe³⁺ → Zn²⁺ + 2Fe²⁺ (Pt electrode for the iron ions)?',['Zn | Zn²⁺ ‖ Fe³⁺, Fe²⁺ | Pt','Pt | Fe³⁺, Fe²⁺ ‖ Zn²⁺ | Zn','Zn | Zn²⁺ ‖ Fe²⁺ | Fe','Fe | Fe³⁺ ‖ Zn²⁺ | Zn'],'Anode Zn left; both iron ions in the same solution (comma) with inert Pt on the right.',['','Reversed — Zn is the anode.','No Fe metal is involved.','No Fe metal; reversed.']),
X(25,'X | X²⁺ ‖ Cu²⁺ | Cu has E°cell = +0.60 V. Given E°(Cu²⁺/Cu) = +0.34 V, what is E°(X²⁺/X)?',['−0.26 V','+0.26 V','+0.94 V','−0.94 V'],'0.60 = 0.34 − E°(X) → E°(X) = −0.26 V (this is nickel).',['','Sign error.','You added.','Wrong arithmetic.']),
X(26,'Which statement is true for BOTH voltaic and electrolytic cells?',['Electrons flow through the external circuit from the anode to the cathode','The anode is negative','The reaction has a positive E°cell','A salt bridge is always needed'],'Electrons always leave the anode (oxidation) and arrive at the cathode (reduction).',['','Positive in electrolytic cells.','Electrolytic reactions have negative E°cell.','Electrolytic cells usually use one container.']),
X(27,'Electrolysis of water, 2H₂O → 2H₂ + O₂, has E°cell = −1.23 V. What is needed to make it happen?',['An applied voltage of more than 1.23 V','Any voltage above 0 V','A catalyst only','A salt bridge'],'The supply must exceed the size of the negative E°cell.',['','Must overcome 1.23 V.','Catalysts do not provide energy.','Not relevant.']),
X(28,'In the Down’s cell, why must the Na and Cl₂ products be kept apart?',['They would react violently to re-form NaCl','Na would be oxidized by water vapour only','Cl₂ is reduced at the anode','To keep the electrolyte from melting'],'Sodium and chlorine react spontaneously, undoing the electrolysis.',['','The main reason is reaction with Cl₂.','Cl⁻ is oxidized at the anode.','The cell must stay molten.']),
X(29,'Concentrated aqueous CuCl₂ is electrolyzed with inert electrodes. Products?',['Cu at the cathode, Cl₂ at the anode','H₂ at the cathode, Cl₂ at the anode','Cu at the cathode, O₂ at the anode','H₂ at the cathode, O₂ at the anode'],'Cu²⁺ is reduced more easily than water; concentrated Cl⁻ is oxidized to Cl₂.',['','Cu²⁺ beats water at the cathode.','Concentrated chloride gives Cl₂.','Both electrodes wrong.']),
X(30,'Which set-up correctly silver-plates a steel spoon?',['Spoon = cathode (−); silver bar = anode (+); electrolyte AgNO₃(aq)','Spoon = anode (+); silver bar = cathode (−); electrolyte AgNO₃(aq)','Spoon = cathode (−); silver bar = anode (+); electrolyte NaCl(aq)','Spoon = cathode (+); silver bar = anode (−); electrolyte AgNO₃(aq)'],'Object at the negative cathode; plating metal as anode; electrolyte with Ag⁺.',['','The spoon would dissolve, not be plated.','No Ag⁺ ions in NaCl.','Signs wrong for an electrolytic cell.'])
]});

EX.push({id:5, name:'Exam 5', level:'Real Exam', tag:'EoT1 Simulation', color:'#7c3aed', realistic:true,

X(3,'Which is the best definition of an oxidizing agent?',['A substance that oxidizes another substance by accepting its electrons','A substance that oxidizes another substance by donating electrons','A substance that is oxidized by gaining electrons','A substance that always contains oxygen'],'The oxidizing agent accepts electrons (and is reduced).',['','Donating electrons = reducing agent.','Gaining electrons is reduction.','Many oxidizing agents have no oxygen (Cl₂, F₂, Ag⁺).']),
X(4,'In Cu(s) + 2Ag⁺(aq) → Cu²⁺(aq) + 2Ag(s), which pair gives the reducing agent followed by the oxidizing agent?',['Cu, Ag⁺','Ag⁺, Cu','Cu²⁺, Ag','Ag, Cu²⁺'],'Cu donates electrons; Ag⁺ accepts them.',['','Reversed.','Products.','Products.']),
X(5,'What is the oxidizing agent in the thermite reaction, 2Al + Fe₂O₃ → Al₂O₃ + 2Fe?',['Fe₂O₃','Al','Al₂O₃','Fe'],'Fe: +3 → 0 → Fe₂O₃ is reduced → oxidizing agent.',['','Al is oxidized → reducing agent.','Product.','Product.']),
X(6,'What happens to the oxidation numbers in 2Ca + O₂ → 2CaO?',['Ca: 0 → +2; O: 0 → −2','Ca: 0 → −2; O: 0 → +2','Ca: +2 → 0; O: −2 → 0','Both stay unchanged'],'Ca increases (oxidized); O decreases (reduced).',['','Metals become positive.','Elements start at zero.','The elements combine, so numbers change.']),
X(7,'Arrange in order of INCREASING oxidation number of nitrogen: NO₂, NH₃, N₂, N₂O',['NH₃, N₂, N₂O, NO₂','N₂, NH₃, N₂O, NO₂','NO₂, N₂O, N₂, NH₃','NH₃, N₂O, N₂, NO₂'],'NH₃ −3, N₂ 0, N₂O +1, NO₂ +4.',['','NH₃ (−3) is below N₂ (0).','This is decreasing order.','N₂ (0) is below N₂O (+1).']),
X(8,'In which compound is the oxidation number of hydrogen −1?',['CaH₂','H₂O','NH₃','H₂SO₄'],'CaH₂ is a metal hydride: +2 + 2x = 0 → x = −1.',['','+1.','+1.','+1.']),
X(9,'In which compound does sulfur have the HIGHEST oxidation number?',['H₂SO₄','SO₂','Na₂S₂O₃','H₂S'],'H₂SO₄ +6; SO₂ +4; Na₂S₂O₃ +2; H₂S −2.',['','+4.','+2.','−2.']),
X(10,'An iron nail placed in CuSO₄ solution becomes coated with red-brown copper and the solution turns pale green. Which element is oxidized?',['Fe','Cu','S','O'],'Fe(s) → Fe²⁺(aq) (pale green): 0 → +2.',['','Cu²⁺ is reduced to Cu.','S stays +6 in sulfate.','O stays −2.']),
X(11,'In 2Al + 6HCl → 2AlCl₃ + 3H₂, which element is reduced and how does its oxidation number change?',['H: +1 → 0','Al: 0 → +3','Cl: −1 → 0','H: 0 → +1'],'H in HCl (+1) becomes H₂ (0).',['','That is oxidation.','Cl stays −1.','Direction reversed.']),
X(12,'Find x in ClO₃⁻ + 6H⁺ + x e⁻ → Cl⁻ + 3H₂O.',['6','5','3','1'],'Left before e⁻: −1 + 6 = +5; right: −1 → add 6e⁻. (Cl: +5 → −1)',['','Charge: +5 − 5 = 0 ≠ −1.','3 is the water count.','Charge does not balance.']),
X(13,'Which pair of half-reactions is correct for 2Fe³⁺ + Sn²⁺ → 2Fe²⁺ + Sn⁴⁺?',['Oxidation: Sn²⁺ → Sn⁴⁺ + 2e⁻; Reduction: Fe³⁺ + e⁻ → Fe²⁺','Oxidation: Fe³⁺ + e⁻ → Fe²⁺; Reduction: Sn²⁺ → Sn⁴⁺ + 2e⁻','Oxidation: Sn⁴⁺ + 2e⁻ → Sn²⁺; Reduction: Fe²⁺ → Fe³⁺ + e⁻','Oxidation: Fe²⁺ → Fe³⁺ + e⁻; Reduction: Sn⁴⁺ + 2e⁻ → Sn²⁺'],'Sn: +2 → +4 (oxidation); Fe: +3 → +2 (reduction).',['','Labels swapped.','Both reversed.','Describes the reverse reaction.']),
X(14,'Balance in acid: 2MnO₄⁻ + 5SO₂ + 2H₂O → 2Mn²⁺ + 5SO₄²⁻ + ___',['4H⁺','8H⁺','2H⁺','4OH⁻'],'H: 4 = 4; charge: −2 = +4 − 10 + 4 ✔.',['','Charge would be +2.','H not balanced.','OH⁻ is not used in acid.']),
X(15,'Balance in acid: Cr₂O₇²⁻ + _H₂S + 8H⁺ → 2Cr³⁺ + _S + 7H₂O. The coefficient of H₂S is…',['3','6','2','1'],'Cr gains 6e⁻; each H₂S (S −2 → 0) loses 2e⁻ → 3 H₂S. H: 6 + 8 = 14 ✔',['','Too many electrons.','Only 4e⁻.','Only 2e⁻.']),
X(16,'When converting an acid-balanced equation to basic conditions, after adding OH⁻ to both sides and combining H⁺ + OH⁻ into water, the final step is to…',['cancel H₂O molecules that appear on both sides','add more H⁺ to balance charge','remove all OH⁻','multiply by 2'],'Cancel water that appears on both sides; check atoms and charge.',['','No H⁺ can remain in base.','OH⁻ stays in the final equation.','Not required.']),
X(17,'Balance in base: 3Cl₂ + 6OH⁻ → _Cl⁻ + ClO₃⁻ + 3H₂O',['5','3','6','1'],'Cl: 6 = 5 + 1; charge −6 = −5 − 1 ✔.',['','Cl and charge not balanced.','Cl would be 7.','Electrons not balanced.']),
X(18,'Which statement correctly describes an electrochemical cell?',['An apparatus that uses a redox reaction to produce electrical energy, or uses electrical energy to cause a chemical reaction','A device that only stores static electricity','A container where acids neutralize bases','A cell that works only with molten salts'],'Two types: voltaic (produces) and electrolytic (consumes) electrical energy.',['','Capacitors store charge — not redox.','Neutralization is not redox.','Most cells use aqueous solutions.']),
X(19,'In a Mg | Mg²⁺ ‖ Cu²⁺ | Cu voltaic cell, which statement is correct?',['Electrons flow from Mg to Cu through the wire and cations in the salt bridge move toward the Cu half-cell','Electrons flow from Cu to Mg and anions move toward Cu','Electrons pass through the salt bridge from Mg to Cu','Conventional current flows from Mg to Cu in the wire'],'Mg is the anode. Cations move to the cathode (Cu) to replace Cu²⁺ being reduced.',['','Both directions reversed.','Only ions pass through the salt bridge.','Conventional current flows Cu → Mg in the wire.']),
X(20,'A voltaic cell uses Al³⁺/Al and Ag⁺/Ag. Which half-reactions occur?',['Anode: Al → Al³⁺ + 3e⁻; Cathode: Ag⁺ + e⁻ → Ag','Anode: Ag → Ag⁺ + e⁻; Cathode: Al³⁺ + 3e⁻ → Al','Anode: Ag⁺ + e⁻ → Ag; Cathode: Al → Al³⁺ + 3e⁻','Anode: Al³⁺ + 3e⁻ → Al; Cathode: Ag → Ag⁺ + e⁻'],'Al (more negative E°) is oxidized at the anode; Ag⁺ is reduced at the cathode.',['','Non-spontaneous direction.','Reduction never occurs at the anode.','Reversed reactions.']),
X(21,'The standard reduction potential (E°) of a half-cell is…',['its tendency to be reduced, measured against the SHE under standard conditions','the voltage of any cell at 0 °C','always positive','the energy needed to melt the electrode'],'Measured relative to SHE (0.00 V) at 25 °C, 1 atm, 1 M.',['','Standard temperature is 25 °C.','Many E° values are negative.','Unrelated.']),
X(22,'The SHE is connected to Ag⁺/Ag (+0.80 V). Which half-reaction occurs at the hydrogen electrode?',['H₂ → 2H⁺ + 2e⁻','2H⁺ + 2e⁻ → H₂','Ag⁺ + e⁻ → Ag','Ag → Ag⁺ + e⁻'],'Ag⁺ has the higher E° → cathode; SHE is the anode (H₂ oxidized).',['','The SHE is the cathode only against negative E° half-cells.','That happens at the silver electrode.','Silver is not oxidized here.']),
X(23,'E°(Sn²⁺/Sn) = −0.14 V, E°(Ag⁺/Ag) = +0.80 V. Find E°cell and decide spontaneity.',['+0.94 V, spontaneous','+0.66 V, spontaneous','−0.94 V, non-spontaneous','+1.74 V, spontaneous'],'0.80 − (−0.14) = +0.94 V > 0 → spontaneous.',['','You did 0.80 − 0.14.','Reversed.','You doubled the silver potential.']),
X(24,'Which gives the correct cell notation AND overall equation for the Ni–Au cell? (Ni²⁺/Ni −0.26 V; Au³⁺/Au +1.50 V)',['Ni | Ni²⁺ ‖ Au³⁺ | Au; 3Ni + 2Au³⁺ → 3Ni²⁺ + 2Au','Au | Au³⁺ ‖ Ni²⁺ | Ni; 2Au + 3Ni²⁺ → 2Au³⁺ + 3Ni','Ni | Ni²⁺ ‖ Au³⁺ | Au; Ni + Au³⁺ → Ni²⁺ + Au','Ni | Ni²⁺ ‖ Au³⁺ | Au; 2Ni + 3Au³⁺ → 2Ni²⁺ + 3Au'],'6e⁻: 3Ni lose 6e⁻; 2Au³⁺ gain 6e⁻.',['','Non-spontaneous direction.','Charge not balanced.','Electrons not balanced (4 vs 9).']),

function route(){

// ---------- question card ----------
var PERM={};
function qCard(key,num,mode,picked){
  var q=getQ(key);if(!PERM[key])PERM[key]=shuffle(q.o.map(function(_,i){return i;}));
  var perm=PERM[key];
  var h='<div class="qcard" data-key="'+key+'" data-mode="'+mode+'"><div class="qtop"><span class="qnum">'+num+'</span><span class="qtag">Goal Q'+q.g+' · '+marks(q.g)+' marks</span><button class="flagbtn" data-act="report" title="Report a problem with this question">🚩 Report</button></div>'+
  '<div class="qtext">'+esc(q.q)+'</div><div class="opts">';
  perm.forEach(function(oi,pos){h+='<button class="opt'+(picked===oi?' sel':'')+'" data-oi="'+oi+'"><span class="L">'+LET[pos]+'</span><span>'+esc(q.o[oi])+'</span></button>';});
  return h+'</div><div class="fb"></div></div>';}
function reveal(card,oi){
  var key=card.getAttribute('data-key'),q=getQ(key);var ok=oi===q.a;
  $$('.opt',card).forEach(function(b){var i=+b.getAttribute('data-oi');b.disabled=true;if(i===q.a)b.classList.add('right');if(i===oi&&!ok)b.classList.add('wrong');});
  var fb='';
  if(!ok){fb+='<div class="warn">⚠️ <b>Not quite — you chose “'+esc(q.o[oi])+'”.</b> '+esc(q.w[oi]||'This option does not fit the rule for this question.')+'</div>';}
  fb+='<div class="expl '+(ok?'good':'')+'">'+(ok?'✅ <b>Correct!</b> ':'✅ <b>Correct answer: '+esc(q.o[q.a])+'.</b> ')+esc(q.e)+'</div>';
  if(!ok)fb+='<a class="tiny" href="#goal-'+q.g+'">📖 Review lesson Q'+q.g+'</a>';
  $('.fb',card).innerHTML=fb;
  if(ok)delete S.mistakes[key];else S.mistakes[key]={t:Date.now()};
  save();return ok;}
function bindInline(card){
  var key=card.getAttribute('data-key');
  card.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
    if(b.getAttribute('data-act')==='report')return openReport(key);
    if(b.classList.contains('opt')&&!b.disabled){var ok=reveal(card,+b.getAttribute('data-oi'));
      var m=/^c(\d+)_(\d+)$/.exec(key);if(m){var g=+m[1];S.checks[g]=S.checks[g]||{};S.checks[g][m[2]]=ok;
        var c=S.checks[g];if(c[0]&&c[1]&&c[2]&&!S.done[g]){S.done[g]=true;toast('🎉 Goal Q'+g+' complete!');}
        else if(Object.keys(c).length===3&&!S.done[g]){toast('Answer all 3 correctly to complete Q'+g+' — you can retry from “Mistakes”.');}
        save();}}});}

// ---------- report ----------
function openReport(key){
  var q=getQ(key);var m=$('#modal');
  m.innerHTML='<div class="mbox"><h3>🚩 Report a problem</h3><p class="muted">'+esc(q.src)+': “'+esc(q.q.slice(0,90))+(q.q.length>90?'…':'')+'”</p>'+
  '<div class="reasons">'+['The marked answer is wrong','More than one answer is correct','Typo / formatting error','Explanation is unclear','Other'].map(function(r,i){return '<label><input type="radio" name="rr" value="'+r+'"'+(i===0?' checked':'')+'> '+r+'</label>';}).join('')+'</div>'+
  '<textarea id="rtext" placeholder="Tell us what is wrong (optional)…"></textarea><div class="row"><button class="btn" id="rsend">Save report</button><button class="btn ghost" id="rcancel">Cancel</button></div>'+
  '<p class="muted small">Reports are saved on this device. Open “Mistakes &amp; Reports” to copy them and send to your teacher.</p></div>';
  m.classList.add('show');
  $('#rcancel').onclick=function(){m.classList.remove('show');};
  $('#rsend').onclick=function(){var r=$('input[name=rr]:checked').value;S.reports.push({key:key,src:q.src,q:q.q,reason:r,note:$('#rtext').value,t:Date.now()});save();m.classList.remove('show');toast('Report saved — thank you!');};}
