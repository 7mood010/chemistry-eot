<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedoxReady — G12 Advanced Chemistry EoT1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e2e8f0;--pri:#6d28d9;--pri2:#db2777;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--warnb:#fff7ed;--tint:#f1f5f9;--sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06)}
[data-theme=dark]{--bg:#0b1020;--card:#131a2e;--ink:#e8ecf6;--ink2:#cbd5e1;--mut:#94a3b8;--line:#243049;--tint:#1a2340;--okb:#0f2e1c;--nob:#3a1414;--warnb:#33210c;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px}
a{color:var(--pri)}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:var(--ink);white-space:nowrap}
.logo i{font-style:normal;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:18px}
.logo small{display:block;font-weight:600;color:var(--mut);font-size:11px;line-height:1.1}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
.nav a{padding:8px 12px;border-radius:10px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a:hover{background:var(--tint)}.nav a.on{background:var(--pri);color:#fff}
#themeBtn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:16px}
main{max-width:1120px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:clamp(26px,4vw,40px);line-height:1.15;margin:.2em 0 .4em;letter-spacing:-.02em}
h2{font-size:22px;margin:.2em 0 .6em;letter-spacing:-.01em}h3{margin:.3em 0}
.sec{margin:34px 0 14px}.muted{color:var(--mut)}.small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--sh);margin:16px 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--pri),#7c3aed);color:#fff;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;box-shadow:0 4px 14px rgba(109,40,217,.25);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 12px;font-size:14px}.btn.big{padding:14px 26px;font-size:17px;margin-top:10px}.btn.danger{background:linear-gradient(135deg,#ef4444,#db2777)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pill{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--tint);font-size:13px;font-weight:700;color:var(--ink2)}
.start .pill{color:#fff}
/* hero */
.hero{display:grid;grid-template-columns:1.6fr 1fr;gap:26px;align-items:center;background:radial-gradient(1200px 400px at 0% 0%,rgba(219,39,119,.12),transparent),radial-gradient(900px 400px at 100% 100%,rgba(109,40,217,.16),transparent),var(--card);border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:var(--sh)}
.grad{background:linear-gradient(90deg,var(--pri),var(--pri2),#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:17px;color:var(--ink2);max-width:60ch}
.hero-r{display:flex;flex-direction:column;align-items:center;gap:16px}
.ring{--p:0;width:170px;height:170px;border-radius:50%;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--tint) 0);display:grid;place-items:center}
.ring>div{width:136px;height:136px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-size:34px;line-height:1}.ring small{color:var(--mut);font-size:12px}.ring.big{width:190px;height:190px}.ring.big>div{width:154px;height:154px}
.mini{display:flex;gap:12px}.mini div{background:var(--tint);border-radius:14px;padding:10px 16px;text-align:center}.mini b{display:block;font-size:22px}.mini small{color:var(--mut);font-size:12px}
.bp{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.bp div{background:var(--tint);border-radius:14px;padding:14px;text-align:center}.bp b{display:block;font-size:26px}.bp small{color:var(--mut);font-size:13px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.unit{display:flex;gap:12px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--sh);border-top:4px solid var(--c)}
.unit .ui{font-size:28px}.unit small{display:block;color:var(--mut);font-size:12.5px}
.bar{height:6px;background:var(--tint);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--c,var(--pri))}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.how div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.how span{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;font-weight:800;margin-right:6px}
/* learn */
.phead{margin-bottom:8px}.ublock{margin:22px 0}.uhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ublock h2{border-left:6px solid var(--c);padding-left:10px}
.goals{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.goalc{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:.15s}
.goalc:hover{border-color:var(--c);transform:translateY(-1px)}
.goalc .qn{min-width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--ink);font-weight:800}
.goalc small{display:block;color:var(--mut);font-size:12.5px}.goalc .st{margin-left:auto;font-weight:800;color:var(--mut);font-size:14px}
.goalc.done .st{color:var(--ok);font-size:20px}.goalc.done .qn{background:var(--ok);color:#fff}
.crumbs{font-size:14px;color:var(--mut);margin-bottom:10px}.crumbs a{text-decoration:none}
/* lesson */
.lesson{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:var(--sh)}
.lhead{display:flex;gap:18px;align-items:flex-start}.qbig{min-width:74px;height:74px;border-radius:20px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center}
.lesson h1{font-size:clamp(22px,3.2vw,32px);margin-top:0}
.outcome{background:var(--tint);border-left:4px solid var(--c);border-radius:10px;padding:10px 14px;font-weight:600}.outcome span{display:block;font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.meta span{font-size:13px;background:var(--tint);padding:4px 10px;border-radius:999px;color:var(--ink2)}
.content{font-size:16.5px}.content h4{margin:22px 0 8px;font-size:18px}
.key{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 10%,var(--card)),var(--card));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));border-radius:16px;padding:16px 18px;margin:16px 0}.key h4{margin-top:0}
.ex{background:var(--tint);border-radius:14px;padding:14px 18px;margin:14px 0}.ex h5{margin:0 0 6px;font-size:15px;color:var(--pri)}
.trap{background:var(--nob);border:1px solid color-mix(in srgb,var(--no) 30%,transparent);border-radius:12px;padding:12px 16px;margin:14px 0}
.tip{background:var(--okb);border-radius:12px;padding:12px 16px;margin:14px 0}
.mnemo{background:linear-gradient(90deg,#fef3c7,#fde68a);color:#422006;border-radius:12px;padding:12px 16px;margin:14px 0;font-weight:600}
.eq{font-weight:700;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;overflow-x:auto;white-space:nowrap;font-size:17px}
.eq.good{border:2px solid var(--ok);background:var(--okb)}.eq.big{font-size:19px;text-align:center}
.eq-in{font-weight:700;background:var(--card);padding:1px 7px;border-radius:6px;border:1px solid var(--line);white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}.tbl th{background:var(--tint);font-size:13.5px}
.tbl.calc td:first-child{font-weight:700;white-space:nowrap}.tbl tr.she td{background:#fef9c3;color:#422006;font-weight:700}
.rules{padding-left:22px}.rules li{margin:4px 0}.steps li{margin:6px 0}.bul li{margin:5px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two .card,.two>.card{margin:0}
.content .card{background:var(--tint);border-radius:14px;padding:14px 16px;border:0;box-shadow:none}.card.c1{border-top:4px solid #dc2626}.card.c2{border-top:4px solid #2563eb}
.figwrap{background:var(--tint);border-radius:18px;padding:12px;margin:18px 0}
.fig{width:100%;height:auto;display:block;max-height:420px}.cap{font-size:13.5px;color:var(--mut);text-align:center;margin:6px 0 0}
.svl{font-size:15px;font-weight:700;fill:var(--ink2)}.svs{font-size:13px;font-weight:600;fill:var(--ink2)}.svh{font-size:15px;font-weight:800}.svb{font-size:18px;font-weight:800;fill:var(--ink)}
.oilrig{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.or{border-radius:16px;padding:16px;color:#fff}.or.ox{background:linear-gradient(135deg,#ef4444,#f97316)}.or.rd{background:linear-gradient(135deg,#2563eb,#7c3aed)}
.or .big{font-size:40px;font-weight:800;line-height:1}.or .big.sm{font-size:22px}.or ul{margin:6px 0 0;padding-left:18px}
.arrowx{font-size:26px;font-weight:800;text-align:center;color:var(--ink2)}.arrowx small{display:block;font-size:12px;font-weight:600;color:var(--mut)}
.flow{display:flex;flex-wrap:wrap;gap:8px}.flow div{flex:1 1 140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:600;font-size:14px;position:relative}
.flow span{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:8px;background:var(--pri);color:#fff;font-size:12px;margin-right:6px}.flow .hl{border-color:#2563eb}.flow .hl span{background:#2563eb}
.ladder{border-radius:14px;overflow:hidden;border:1px solid var(--line)}.lad-side{padding:8px 14px;font-weight:700;font-size:13.5px}.lad-side.top{background:#fee2e2;color:#7f1d1d}.lad-side.bot{background:#dbeafe;color:#1e3a8a}
.lad-row{display:flex;justify-content:space-between;padding:7px 14px;background:var(--card);border-top:1px solid var(--line);font-weight:600}.lad-row.she{background:#fef9c3;color:#422006}
.notn{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:4px}.notn .nb{padding:12px 14px;border-radius:12px;font-weight:800;font-size:18px;text-align:center}.nb.an{background:#fee2e2;color:#7f1d1d}.nb.ca{background:#dbeafe;color:#1e3a8a}
.notn small{display:block;font-size:11px;font-weight:600}.nl{font-size:26px;font-weight:800;text-align:center;padding:4px 6px}.nl small{font-size:10px;color:var(--mut)}
.video{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#111827,#1f2937);color:#fff;text-decoration:none;margin:20px 0}
.video .play{width:54px;height:54px;border-radius:14px;background:#ef4444;display:grid;place-items:center;font-size:22px;flex:none}.video small{display:block;color:#cbd5e1;font-size:12.5px}
/* questions */
.checks{margin-top:28px;border-top:2px dashed var(--line);padding-top:16px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:var(--sh)}
.qtop{display:flex;align-items:center;gap:10px;margin-bottom:8px}.qnum{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:10px;background:var(--pri);color:#fff;font-weight:800}
.qtag{font-size:12.5px;font-weight:700;color:var(--mut);background:var(--tint);padding:3px 10px;border-radius:999px}
.flagbtn{margin-left:auto;border:1px solid var(--line);background:transparent;border-radius:9px;padding:4px 10px;cursor:pointer;color:var(--mut);font:inherit;font-size:13px}
.flagbtn:hover{color:var(--no);border-color:var(--no)}
.qtext{font-size:18px;font-weight:700;margin:6px 0 12px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:16px;cursor:pointer;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 6%,var(--card))}
.opt .L{min-width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--tint);font-weight:800}
.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,var(--card))}.opt.sel .L{background:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okb)}.opt.right .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--no);background:var(--nob)}.opt.wrong .L{background:var(--no);color:#fff}
.opt:disabled{cursor:default}
.warn{background:var(--warnb);border:1px solid #fdba74;border-radius:12px;padding:10px 14px;margin:10px 0 6px;animation:pop .25s}
.expl{background:var(--tint);border-radius:12px;padding:10px 14px;margin:6px 0;animation:pop .25s}.expl.good{background:var(--okb)}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tiny{font-size:13px;font-weight:700;text-decoration:none;background:none;border:0;color:var(--pri);cursor:pointer;font-family:inherit;padding:0}
.pn{display:flex;justify-content:space-between;margin-top:24px}
/* exams */
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.excard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh);border-top:6px solid var(--c);display:flex;flex-direction:column}
.excard p{color:var(--ink2);flex:1}.exlvl{display:flex;justify-content:space-between;font-weight:700;color:var(--mut);font-size:13px}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin-left:3px}.dots i.on{background:var(--c)}
.excard h3{font-size:22px}.excard h3 small{font-size:14px;color:var(--mut)}
.exmeta{display:flex;gap:6px;flex-wrap:wrap}.exmeta span{font-size:12.5px;background:var(--tint);padding:3px 9px;border-radius:999px;font-weight:600}
.exbot{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.best{color:var(--mut);font-size:14px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{display:flex;gap:10px;padding:14px;border:2px solid var(--line);border-radius:14px;cursor:pointer}.mode:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 7%,var(--card))}
.mode small{display:block;color:var(--mut)}.opts2{display:flex;flex-wrap:wrap;gap:18px;margin:16px 0 4px;font-weight:600}
.runbar{position:sticky;top:58px;z-index:10;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--sh)}
.runbar small{display:block;color:var(--mut);font-size:12.5px}.runbar>div:first-child{flex:1}
.tmr{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;background:var(--tint);padding:4px 12px;border-radius:10px}.tmr.low{background:var(--nob);color:var(--no)}
.navq{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.nq{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;position:relative}
.nq.ans{background:color-mix(in srgb,var(--pri) 18%,var(--card))}.nq.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.nq.no{background:var(--no);color:#fff;border-color:var(--no)}
.nq.cur{outline:3px solid var(--pri);outline-offset:1px}.nq.fl::after{content:'';position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:#f59e0b}
.runnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.result .rs{display:flex;gap:26px;align-items:center;flex-wrap:wrap}.result .rs>div:last-child{flex:1;min-width:260px}.result h1{font-size:clamp(22px,3vw,30px)}.em{font-size:44px}
.gmap{display:flex;flex-wrap:wrap;gap:6px}.gm{min-width:46px;padding:8px 6px;text-align:center;border-radius:10px;font-weight:800;text-decoration:none;font-size:13px}
.gm.ok{background:var(--okb);color:var(--ok)}.gm.no{background:var(--nob);color:var(--no)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:6px 12px;border-radius:999px;background:var(--tint);text-decoration:none;font-weight:600;font-size:14px;color:var(--ink)}.chip.no{background:var(--nob)}
.rev{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:14px;padding:14px;margin:10px 0}.rev.no{border-left-color:var(--no)}
.rq{display:flex;gap:10px;align-items:flex-start}.rq b{flex:1}.rowr{display:flex;gap:14px;margin-top:6px}
/* tools */
.calc2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.calc2 label{font-weight:700;font-size:14px}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;margin-top:4px}
.cres{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.cres div{background:var(--tint);border-radius:12px;padding:12px}.cres div.big{grid-column:1/-1;background:var(--okb)}
.cres span{display:block;font-size:12.5px;color:var(--mut);font-weight:700}.cres b{font-size:16px}.cres .big b{font-size:20px}
.etab td:last-child{font-weight:800;text-align:right}
.rall{width:100%;min-height:180px;border-radius:12px;border:1px solid var(--line);background:var(--tint);color:var(--ink);padding:12px;font:inherit;font-size:14px}
/* modal & toast */
#modal{position:fixed;inset:0;background:rgba(2,6,23,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}#modal.show{display:flex}
.mbox{background:var(--card);border-radius:20px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.reasons{display:grid;gap:6px;margin:10px 0}.reasons label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
textarea{width:100%;min-height:80px;border-radius:12px;border:1px solid var(--line);padding:10px;font:inherit;background:var(--card);color:var(--ink)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,40px);opacity:0;background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:.25s;z-index:60;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
@media (max-width:820px){.hero{grid-template-columns:1fr;padding:22px}.bp{grid-template-columns:repeat(2,1fr)}.two,.modes,.calc2,.cres{grid-template-columns:1fr}.oilrig{grid-template-columns:1fr}.arrowx{transform:rotate(90deg)}.lhead{flex-direction:column}.lesson{padding:18px}.logo small{display:none}.nav a{padding:7px 9px;font-size:13px}.runbar{top:56px}}
@media (max-width:520px){.logo b{display:none}}
</style>
</head>

L.push({
id:1, unit:'A', title:'Oxidation vs Reduction: electrons, oxygen & hydrogen',
outcome:'Distinguish between oxidation and reduction in terms of loss and gain of electrons, oxygen and hydrogen',
ref:'Figures 1, 2 + textbook', pages:'3, 4',
video:{id:'W4-LMBx9AFs', t:'Redox reactions overview (from Mr. Luke\'s lesson)'},
fig:'oilrig',
html:`
<p>A <b>redox reaction</b> (reduction–oxidation) is any reaction in which <b>electrons are transferred</b> from one species to another. Burning fuels, rusting, bleach, batteries and getting metals from ores are all redox reactions.</p>
<div class="key"><h4>The three ways to spot it</h4>
<table class="tbl"><tr><th></th><th>Oxidation</th><th>Reduction</th></tr>
<tr><td>Electrons</td><td><b>Loss</b> of e⁻</td><td><b>Gain</b> of e⁻</td></tr>
<tr><td>Oxygen</td><td><b>Gain</b> of oxygen</td><td><b>Loss</b> of oxygen</td></tr>
<tr><td>Hydrogen</td><td><b>Loss</b> of hydrogen</td><td><b>Gain</b> of hydrogen</td></tr></table>
<p class="mnemo">🧠 <b>OIL RIG</b> — <b>O</b>xidation <b>I</b>s <b>L</b>oss, <b>R</b>eduction <b>I</b>s <b>G</b>ain (of electrons)</p></div>
<h4>Oxidation and reduction ALWAYS happen together</h4>
<p>Electrons cannot disappear. If one species loses electrons, another must gain the <b>same number</b>. That is why we say <i>redox</i>.</p>
<div class="ex"><h5>Worked example 1 — electron transfer</h5>
<div class="eq">2Mg(s) + O₂(g) → 2MgO(s)</div>
<ol><li>Each Mg loses 2e⁻: <span class="eq-in">Mg → Mg²⁺ + 2e⁻</span> → <b>oxidized</b> (it also <i>gains oxygen</i>).</li>
<li>Each O₂ gains 4e⁻: <span class="eq-in">O₂ + 4e⁻ → 2O²⁻</span> → <b>reduced</b>.</li>
<li>2 Mg lose 4e⁻ in total = O₂ gains 4e⁻ in total ✔</li></ol></div>
<div class="ex"><h5>Worked example 2 — oxygen &amp; hydrogen transfer</h5>
<div class="eq">CuO + H₂ → Cu + H₂O</div>
<ul><li>CuO <b>loses oxygen</b> → CuO is <b>reduced</b> (Cu: +2 → 0).</li>
<li>H₂ <b>gains oxygen</b> → H₂ is <b>oxidized</b> (H: 0 → +1).</li></ul>
<div class="eq">C₂H₆ → C₂H₄ + H₂ &nbsp;&nbsp;(ethane <b>loses hydrogen</b> → oxidized)</div></div>
<div class="trap">⚠️ <b>Exam trap:</b> “gain” means opposite things! Gain of <b>electrons</b> = reduction, but gain of <b>oxygen</b> = oxidation. Read which particle the question talks about.</div>`,
checks:[
{q:'Which statement correctly describes oxidation?',o:['Loss of electrons','Gain of electrons','Gain of hydrogen','Loss of oxygen'],a:0,e:'OIL RIG: Oxidation Is Loss of electrons. Oxidation is also gain of oxygen or loss of hydrogen.',w:['','Gaining electrons is reduction (RIG).','Gaining hydrogen is reduction.','Losing oxygen is reduction.']},
{q:'In CuO + H₂ → Cu + H₂O, which reactant is reduced?',o:['CuO','H₂','H₂O','Cu'],a:0,e:'CuO loses its oxygen (and Cu goes from +2 to 0), so CuO is reduced. H₂ gains oxygen and is oxidized.',w:['','H₂ gains oxygen → it is oxidized.','H₂O is a product, not a reactant.','Cu is a product; the question asks for a reactant.']},
{q:'Methanol, CH₃OH, is converted to methanal, HCHO, by removing two hydrogen atoms. Methanol has been…',o:['oxidized','reduced','neither oxidized nor reduced','both oxidized and reduced'],a:0,e:'Loss of hydrogen = oxidation. (This is how alcohols are oxidized to aldehydes.)',w:['','Gain of hydrogen would be reduction — here H is lost.','A change in the number of H atoms bonded to carbon is a redox change.','Only one change happened: loss of H = oxidation.']}
]});

L.push({
id:2, unit:'A', title:'What is an oxidation number?',
outcome:'Define oxidation number', ref:'Textbook', pages:'5',
video:{id:'-a2ckxhfDjQ', t:'Oxidation numbers explained (from Mr. Luke\'s lesson)'},
html:`
<div class="key"><h4>Definition</h4>
<p>The <b>oxidation number</b> of an atom in an ionic compound is the <b>number of electrons lost or gained</b> by the atom when it forms an ion.</p>
<p>More generally, it is the <b>charge an atom would have</b> if all its shared electrons were given to the <b>more electronegative</b> atom. It is a bookkeeping tool scientists use to <b>track electrons</b> in redox reactions.</p></div>
<ul class="bul"><li>Na in NaCl is <b>+1</b> → sodium lost 1 electron.</li>
<li>Cl in NaCl is <b>−1</b> → chlorine gained 1 electron.</li>
<li>C in CO₂ is <b>+4</b>, but CO₂ is covalent — there is no real C⁴⁺ ion. The +4 is an <i>assigned</i> number.</li></ul>
<div class="tip">✍️ <b>How to write it:</b> sign <b>before</b> the number for oxidation numbers (<b>+2</b>, <b>−1</b>); number before the sign for ion charges (Mg<b>²⁺</b>).</div>
<h4>Why it matters</h4>
<p>If an atom’s oxidation number <b>increases</b> → it was <b>oxidized</b>. If it <b>decreases</b> → it was <b>reduced</b>. This works even when no ions form (covalent reactions).</p>`,
checks:[
{q:'Which best defines the oxidation number of an atom in an ionic compound?',o:['The number of electrons lost or gained by the atom when it forms an ion','The number of protons in the nucleus','The number of valence electrons the atom has','The number of atoms of that element in the formula'],a:0,e:'Textbook definition: the number of electrons lost or gained by the atom when it forms an ion.',w:['','That is the atomic number.','Valence electrons do not change with bonding — oxidation numbers do.','Subscripts count atoms, not electrons transferred.']},
{q:'In CO₂ carbon is assigned +4. This means…',o:['carbon would have a +4 charge if the shared electrons were assigned to the more electronegative oxygen','CO₂ contains a C⁴⁺ ion','carbon has 4 protons','carbon gained 4 electrons'],a:0,e:'In covalent molecules the oxidation number is a bookkeeping charge, not a real ion charge.',w:['','CO₂ is a covalent molecule — no real C⁴⁺ ion exists.','Carbon has 6 protons.','A positive oxidation number means electrons are (formally) lost, not gained.']},
{q:'An atom’s oxidation number changes from −1 to +3 in a reaction. The atom was…',o:['oxidized, losing 4 electrons','reduced, gaining 4 electrons','oxidized, losing 2 electrons','reduced, gaining 2 electrons'],a:0,e:'Increase = oxidation. Change = +3 − (−1) = 4, so 4 electrons are lost per atom.',w:['','The number went UP → oxidation, not reduction.','The change is 4 (from −1 to +3), not 2.','Increase means oxidation, and the change is 4.']}
]});

L.push({
id:3, unit:'A', title:'Oxidizing agent & reducing agent (definitions)',
outcome:'Define oxidizing agent and reducing agent in a redox reaction', ref:'Table 2', pages:'6',
video:{id:'VXvtkwubQQg', t:'Oxidizing & reducing agents (watch to 3:00)'},
fig:'agents',
html:`
<div class="key"><h4>Table 2 — summary</h4>
<table class="tbl"><tr><th>Term</th><th>Electrons</th><th>Oxidation number</th><th>What happens to it</th></tr>
<tr><td><b>Oxidizing agent</b></td><td><b>accepts</b> (gains) e⁻</td><td>decreases ↓</td><td>is <b>reduced</b></td></tr>
<tr><td><b>Reducing agent</b></td><td><b>donates</b> (loses) e⁻</td><td>increases ↑</td><td>is <b>oxidized</b></td></tr></table></div>
<p>An <b>oxidizing agent</b> is the substance that <b>oxidizes another substance</b> by accepting its electrons. A <b>reducing agent</b> is the substance that <b>reduces another substance</b> by losing electrons to it.</p>
<div class="mnemo">🧠 The agent does the OPPOSITE to itself: the <b>oxidizing</b> agent gets <b>reduced</b>; the <b>reducing</b> agent gets <b>oxidized</b>.</div>
<ul class="bul"><li>Strong oxidizing agents: F₂, Cl₂, O₂, MnO₄⁻, Cr₂O₇²⁻ (very electronegative / high oxidation numbers).</li>
<li>Strong reducing agents: active metals (Li, Na, K, Mg, Al), H₂, C, CO.</li></ul>
<div class="trap">⚠️ The agents are always <b>reactants</b>. Products only tell you what the agents turned into.</div>`,
checks:[
{q:'An oxidizing agent…',o:['accepts electrons and is reduced','loses electrons and is oxidized','accepts electrons and is oxidized','loses electrons and is reduced'],a:0,e:'The oxidizing agent takes electrons from another substance, so it is itself reduced.',w:['','That describes the reducing agent.','Accepting electrons is reduction, not oxidation.','Losing electrons is oxidation, not reduction.']},
{q:'What happens to the oxidation number of a reducing agent?',o:['It increases','It decreases','It stays the same','It becomes zero'],a:0,e:'A reducing agent is oxidized, so its oxidation number goes up.',w:['','Decrease belongs to the oxidizing agent (it is reduced).','If nothing changes it is not taking part in redox.','There is no rule that it becomes zero.']},
{q:'Which is the best reducing agent?',o:['Na(s)','F₂(g)','Cl₂(g)','MnO₄⁻(aq)'],a:0,e:'Active metals such as sodium lose electrons easily, so they are strong reducing agents.',w:['','F₂ is the strongest oxidizing agent.','Cl₂ is an oxidizing agent.','Permanganate is a strong oxidizing agent.']}
]});

L.push({
id:4, unit:'A', title:'Identifying agents from electron transfer',
outcome:'Identify oxidizing agent and reducing agent in a redox reaction', ref:'Textbook + Example Problem 1 + practice problems', pages:'5, 6, 8',
video:{id:'VXvtkwubQQg', t:'Oxidizing & reducing agents'},
html:`
<h4>4-step method</h4>
<ol class="steps"><li>Assign oxidation numbers to every atom on both sides.</li>
<li>Find the atom whose number <b>goes up</b> → that reactant is <b>oxidized</b> = <b>reducing agent</b>.</li>
<li>Find the atom whose number <b>goes down</b> → that reactant is <b>reduced</b> = <b>oxidizing agent</b>.</li>
<li>Check: electrons lost = electrons gained.</li></ol>
<div class="ex"><h5>Example — Zn in copper(II) sulfate</h5>
<div class="eq">Zn(s) + CuSO₄(aq) → ZnSO₄(aq) + Cu(s)</div>
<div class="eq">Zn: 0 → +2 &nbsp;&nbsp;|&nbsp;&nbsp; Cu: +2 → 0 &nbsp;&nbsp;|&nbsp;&nbsp; SO₄²⁻ unchanged (spectator)</div>
<ul><li>Zn is oxidized → <b>Zn is the reducing agent</b>: Zn → Zn²⁺ + 2e⁻</li>
<li>Cu²⁺ is reduced → <b>Cu²⁺ (CuSO₄) is the oxidizing agent</b>: Cu²⁺ + 2e⁻ → Cu</li></ul></div>
<div class="ex"><h5>Example — Cu wire in silver nitrate</h5>
<div class="eq">Cu(s) + 2AgNO₃(aq) → Cu(NO₃)₂(aq) + 2Ag(s)</div>
<p>Cu: 0 → +2 (reducing agent). Ag⁺: +1 → 0 (oxidizing agent). Solution turns blue (Cu²⁺), silver crystals grow.</p></div>
<div class="trap">⚠️ Spectator ions (SO₄²⁻, NO₃⁻, Na⁺, K⁺…) keep the same oxidation number — they are <b>never</b> the agent.</div>`,
checks:[
{q:'In Zn(s) + 2Ag⁺(aq) → Zn²⁺(aq) + 2Ag(s), the oxidizing agent is…',o:['Ag⁺','Zn','Zn²⁺','Ag'],a:0,e:'Ag⁺ (+1 → 0) gains electrons, is reduced, so it is the oxidizing agent.',w:['','Zn loses electrons → it is the reducing agent.','Zn²⁺ is a product, not an agent.','Ag is a product, not an agent.']},
{q:'In Mg(s) + Cu²⁺(aq) → Mg²⁺(aq) + Cu(s), which pair is (reducing agent, oxidizing agent)?',o:['Mg, Cu²⁺','Cu²⁺, Mg','Mg²⁺, Cu','Cu, Mg²⁺'],a:0,e:'Mg is oxidized (reducing agent); Cu²⁺ is reduced (oxidizing agent).',w:['','The order is reversed.','These are products — agents are reactants.','These are products — agents are reactants.']},
{q:'In 3Mg + N₂ → Mg₃N₂, how many electrons are transferred in total?',o:['6','2','3','8'],a:0,e:'Each Mg loses 2e⁻ (0→+2) × 3 Mg = 6e⁻. Each N gains 3e⁻ (0→−3) × 2 N = 6e⁻.',w:['','2 is for one Mg atom only.','3 is the change for one N atom only.','No combination gives 8.']}
]});

L.push({
id:5, unit:'A', title:'Identifying agents in molecular equations',
outcome:'Identify oxidizing agent and reducing agent in a redox reaction', ref:'Textbook + Example Problem 1 + practice problems', pages:'5, 6, 8',
html:`
<p>In molecular (covalent) reactions there may be no obvious ions, so <b>oxidation numbers are the only reliable tool</b>. The agent is the <b>whole reactant</b> that contains the atom that changes.</p>
<div class="ex"><h5>Example 1</h5>
<div class="eq">2Al + 3Cl₂ → 2AlCl₃</div>
<p>Al: 0 → +3 (oxidized, <b>reducing agent</b>). Cl: 0 → −1 (reduced, <b>Cl₂ = oxidizing agent</b>). 2 Al lose 6e⁻; 3 Cl₂ gain 6e⁻.</p></div>
<div class="ex"><h5>Example 2 — the agent is a compound</h5>
<div class="eq">H₂S + Cl₂ → S + 2HCl</div>
<p>S: −2 → 0 → <b>H₂S is the reducing agent</b> (not “S”). Cl: 0 → −1 → <b>Cl₂ is the oxidizing agent</b>. H stays +1.</p></div>
<div class="ex"><h5>Example 3 — blast furnace</h5>
<div class="eq">Fe₂O₃ + 3CO → 2Fe + 3CO₂</div>
<p>Fe: +3 → 0 → <b>Fe₂O₃ is the oxidizing agent</b>. C: +2 → +4 → <b>CO is the reducing agent</b>.</p></div>
<div class="ex"><h5>Example 4 — one reactant plays two roles?</h5>
<div class="eq">MnO₂ + 4HCl → MnCl₂ + Cl₂ + 2H₂O</div>
<p>Mn: +4 → +2 → <b>MnO₂ oxidizing agent</b>. Some Cl: −1 → 0 → <b>HCl reducing agent</b> (the other 2 Cl stay −1 in MnCl₂).</p></div>
<div class="trap">⚠️ Name the <b>reactant species</b> as the agent (H₂S, CO, Fe₂O₃), not the single atom or the product.</div>`,
checks:[
{q:'In H₂S + Cl₂ → S + 2HCl, the reducing agent is…',o:['H₂S','Cl₂','S','HCl'],a:0,e:'S goes −2 → 0, so H₂S is oxidized: it is the reducing agent.',w:['','Cl₂ is reduced (0 → −1): it is the oxidizing agent.','S is a product.','HCl is a product.']},
{q:'In Fe₂O₃ + 3CO → 2Fe + 3CO₂, the oxidizing agent is…',o:['Fe₂O₃','CO','Fe','CO₂'],a:0,e:'Fe: +3 → 0, so Fe₂O₃ is reduced: it is the oxidizing agent.',w:['','CO is oxidized (C: +2 → +4): it is the reducing agent.','Fe is a product.','CO₂ is a product.']},
{q:'In 2H₂ + O₂ → 2H₂O, which statement is correct?',o:['H₂ is the reducing agent; O₂ is the oxidizing agent','O₂ is the reducing agent; H₂ is the oxidizing agent','H₂O is the oxidizing agent','No redox occurs because no ions form'],a:0,e:'H: 0 → +1 (oxidized, reducing agent); O: 0 → −2 (reduced, oxidizing agent).',w:['','Reversed — O₂ gains electrons, so it is the oxidizing agent.','H₂O is a product, not an agent.','Redox can occur in covalent reactions — oxidation numbers change here.']}
]});

L.push({
id:6, unit:'A', title:'Oxidation & reduction as change in oxidation number',
outcome:'Distinguish between oxidation and reduction in terms of change in oxidation number', ref:'Textbook + Example Problem 1 + practice problems', pages:'5, 6, 8',
fig:'numline',
html:`
<div class="key"><h4>The rule</h4>
<p><b>Oxidation</b> = increase in oxidation number (more positive) ↑<br><b>Reduction</b> = decrease in oxidation number (more negative) ↓</p>
<p>Why? Electrons are negative. Lose something negative → you become more positive.</p></div>
<div class="ex"><h5>Example</h5><div class="eq">2Na + Cl₂ → 2NaCl</div>
<p>Na: 0 → +1 (↑ oxidized). Cl: 0 → −1 (↓ reduced).</p></div>
<div class="ex"><h5>Count electrons from the change</h5>
<p>Electrons transferred per atom = size of the change. S from −2 → +6 = <b>8e⁻ lost</b>. Mn from +7 → +2 = <b>5e⁻ gained</b>.</p></div>
<div class="tip">📌 Practice from the slides: 2Sr + O₂ → 2SrO (Sr 0→+2 oxidized; O 0→−2 reduced); Mg + 2HCl → MgCl₂ + H₂ (Mg 0→+2 oxidized; H +1→0 reduced).</div>`,
checks:[
{q:'In 2K + Cl₂ → 2KCl, what happens to the oxidation numbers?',o:['K: 0 → +1, Cl: 0 → −1','K: 0 → −1, Cl: 0 → +1','K: +1 → 0, Cl: −1 → 0','Both stay unchanged'],a:0,e:'K loses one electron (0 → +1, oxidized); Cl gains one (0 → −1, reduced).',w:['','Metals form positive ions, not negative.','Elements start at 0, not ±1.','The elements combine into ions, so numbers change.']},
{q:'An atom changes from +7 to +2. This is…',o:['reduction, 5 electrons gained','oxidation, 5 electrons lost','reduction, 2 electrons gained','oxidation, 9 electrons lost'],a:0,e:'Decrease = reduction. 7 − 2 = 5 electrons gained.',w:['','The number went DOWN → reduction.','The change is 5, not 2.','Decrease is reduction, and the change is 5.']},
{q:'In Mg + 2HCl → MgCl₂ + H₂, which element is reduced?',o:['H','Mg','Cl','None'],a:0,e:'H goes +1 → 0 (reduced). Mg goes 0 → +2 (oxidized). Cl stays −1.',w:['','Mg is oxidized (0 → +2).','Cl stays −1 — spectator.','H changes, so a reduction happens.']}
]});

L.push({
id:7, unit:'B', title:'Rules for assigning oxidation numbers',
outcome:'Assign oxidation number to atoms, ions and compounds according to a set of rules', ref:'Textbook + Example Problem 2 + practice + Table 3', pages:'9, 10',
video:{id:'-a2ckxhfDjQ', t:'Oxidation number rules'},
html:`
<div class="key"><h4>Table 3 — Rules (learn these in order)</h4>
<ol class="rules">
<li>An <b>uncombined element</b> = <b>0</b> (Na, O₂, Cl₂, S₈, Fe…)</li>
<li>A <b>monatomic ion</b> = its <b>charge</b> (Na⁺ = +1, S²⁻ = −2, Fe³⁺ = +3)</li>
<li>The <b>more electronegative</b> atom in a bond gets the <b>negative</b> number.</li>
<li><b>Fluorine</b> is always <b>−1</b> in compounds.</li>
<li><b>Oxygen</b> is usually <b>−2</b>. Exceptions: <b>peroxides</b> (H₂O₂, Na₂O₂) = <b>−1</b>; in <b>OF₂</b> = <b>+2</b>.</li>
<li><b>Hydrogen</b> is usually <b>+1</b>; in <b>metal hydrides</b> (NaH, CaH₂, LiAlH₄) = <b>−1</b>.</li>
<li><b>Group 1</b> metals = <b>+1</b>, <b>Group 2</b> = <b>+2</b>, <b>Al</b> = <b>+3</b> in compounds.</li>
<li>Sum in a <b>neutral compound</b> = <b>0</b>.</li>
<li>Sum in a <b>polyatomic ion</b> = <b>the ion’s charge</b>.</li></ol></div>
<div class="ex"><h5>Example Problem — Cl in NaCl, Cl₂, KClO, KClO₃</h5>
<p>NaCl: −1 &nbsp;|&nbsp; Cl₂: 0 &nbsp;|&nbsp; KClO: +1 + x + (−2) = 0 → <b>x = +1</b> &nbsp;|&nbsp; KClO₃: +1 + x + 3(−2) = 0 → <b>x = +5</b></p></div>
<div class="trap">⚠️ Most common errors: forgetting H is −1 in metal hydrides, and O is −1 in peroxides.</div>`,
checks:[
{q:'What is the oxidation number of oxygen in O₂?',o:['0','−2','−1','+2'],a:0,e:'Rule 1: an uncombined element has oxidation number 0.',w:['','−2 is for O in most compounds, not in the element.','−1 is for peroxides.','+2 is only in OF₂.']},
{q:'What is the oxidation number of H in NaH?',o:['−1','+1','0','+2'],a:0,e:'NaH is a metal hydride. Na is +1, so H must be −1.',w:['','+1 is normal for H, but not in metal hydrides.','H is combined, so not 0.','Sum must be 0: +1 + (+2) ≠ 0.']},
{q:'What is the oxidation number of Cl in KClO₃?',o:['+5','+3','+7','−1'],a:0,e:'+1 + x + 3(−2) = 0 → x = +5.',w:['','+3 would be in KClO₂.','+7 would be in KClO₄.','−1 is chloride (KCl).']}
]});

L.push({
id:8, unit:'B', title:'Oxidation numbers in ions & special compounds',
outcome:'Assign oxidation number to atoms, ions and compounds according to a set of rules', ref:'Textbook + Example Problem 2 + practice + Table 3', pages:'9, 10',
html:`
<h4>Polyatomic ions — the sum equals the charge</h4>
<div class="ex"><table class="tbl calc">
<tr><td>SO₄²⁻</td><td>x + 4(−2) = −2</td><td>S = <b>+6</b></td></tr>
<tr><td>NO₃⁻</td><td>x + 3(−2) = −1</td><td>N = <b>+5</b></td></tr>
<tr><td>NH₄⁺</td><td>x + 4(+1) = +1</td><td>N = <b>−3</b></td></tr>
<tr><td>MnO₄⁻</td><td>x + 4(−2) = −1</td><td>Mn = <b>+7</b></td></tr>
<tr><td>Cr₂O₇²⁻</td><td>2x + 7(−2) = −2</td><td>Cr = <b>+6</b></td></tr>
<tr><td>PO₄³⁻</td><td>x + 4(−2) = −3</td><td>P = <b>+5</b></td></tr>
<tr><td>ClO⁻</td><td>x + (−2) = −1</td><td>Cl = <b>+1</b></td></tr></table></div>
<h4>Special cases</h4>
<table class="tbl calc">
<tr><td>H₂O₂ (peroxide)</td><td>2(+1) + 2x = 0</td><td>O = <b>−1</b></td></tr>
<tr><td>OF₂</td><td>x + 2(−1) = 0</td><td>O = <b>+2</b></td></tr>
<tr><td>CaH₂ (hydride)</td><td>+2 + 2x = 0</td><td>H = <b>−1</b></td></tr></table>
<div class="tip">📌 Write the equation “sum = charge” every time. It takes 5 seconds and prevents silly mistakes.</div>`,
checks:[
{q:'What is the oxidation number of N in NH₄⁺?',o:['−3','+3','+5','−4'],a:0,e:'x + 4(+1) = +1 → x = −3.',w:['','Sign error — H is +1, so N must be negative.','+5 is N in NO₃⁻.','The sum must equal +1, not 0.']},

{q:'What is the oxidation number of P in PO₄³⁻?',o:['+5','+3','−3','+8'],a:0,e:'x + 4(−2) = −3 → x = +5.',w:['','Sum must be −3: +3 − 8 = −5 ≠ −3.','P is bonded to O, which is more electronegative, so P is positive.','The sum equals the ion charge (−3), not 0.']}
]});

L.push({
id:9, unit:'B', title:'Oxidation numbers in complex formulas',
outcome:'Determines the oxidation number of elements and compounds with more complex formulas.', ref:'Textbook + Example Problem 2 + practice + Table 3', pages:'9, 10',
html:`
<h4>Strategy for big formulas</h4>
<ol class="steps"><li>Write the known numbers first (Group 1, Group 2, O, H, F).</li>
<li>Multiply by the subscripts (and by brackets!).</li>
<li>Let the unknown be x (× its number of atoms).</li>
<li>Sum = 0 for compounds, = charge for ions. Solve.</li></ol>
<div class="ex"><table class="tbl calc">
<tr><td>K₂Cr₂O₇</td><td>2(+1) + 2x + 7(−2) = 0</td><td>Cr = <b>+6</b></td></tr>
<tr><td>Al₂(SO₄)₃</td><td>use SO₄²⁻: x + 4(−2) = −2</td><td>S = <b>+6</b></td></tr>
<tr><td>Ca(ClO₄)₂</td><td>use ClO₄⁻: x − 8 = −1</td><td>Cl = <b>+7</b></td></tr>
<tr><td>Na₂S₂O₃</td><td>2(+1) + 2x + 3(−2) = 0</td><td>S = <b>+2</b></td></tr>
<tr><td>(NH₄)₂Cr₂O₇</td><td>N in NH₄⁺ = −3; Cr in Cr₂O₇²⁻</td><td>N = <b>−3</b>, Cr = <b>+6</b></td></tr>
<tr><td>Fe₃O₄</td><td>3x + 4(−2) = 0</td><td>Fe = <b>+8/3</b> (average)</td></tr>
<tr><td>KMnO₄ / K₂MnO₄ / MnO₂</td><td>—</td><td>Mn = <b>+7 / +6 / +4</b></td></tr>
<tr><td>C₂H₆O (ethanol)</td><td>2x + 6(+1) + (−2) = 0</td><td>C = <b>−2</b> (average)</td></tr>
<tr><td>LiAlH₄</td><td>+1 + 3 + 4x = 0</td><td>H = <b>−1</b></td></tr></table></div>
<div class="trap">⚠️ A subscript outside brackets (like the 3 in Al₂(SO₄)₃) counts groups — it does <b>not</b> change S inside each sulfate.</div>`,
checks:[
{q:'What is the oxidation number of Cr in K₂Cr₂O₇?',o:['+6','+7','+12','+3'],a:0,e:'2(+1) + 2x + 7(−2) = 0 → 2x = 12 → x = +6.',w:['','Check: 2 + 14 − 14 = 2 ≠ 0.','+12 is the total for both Cr atoms — divide by 2.','+3 is Cr in Cr³⁺, after reduction.']},
{q:'In which compound does Mn have the highest oxidation number?',o:['KMnO₄','K₂MnO₄','MnO₂','MnCl₂'],a:0,e:'KMnO₄ = +7, K₂MnO₄ = +6, MnO₂ = +4, MnCl₂ = +2.',w:['','K₂MnO₄ is +6.','MnO₂ is +4.','MnCl₂ is +2.']},
{q:'What is the oxidation number of S in Na₂S₂O₃?',o:['+2','+4','+6','−2'],a:0,e:'2(+1) + 2x + 3(−2) = 0 → 2x = 4 → x = +2.',w:['','+4 forgets there are 2 S atoms.','+6 is S in sulfate.','−2 is S in sulfide.']}
]});

L.push({
id:10, unit:'B', title:'Recognizing oxidation from oxidation-number change',
outcome:'Distinguish between oxidation and reduction in terms of change in oxidation number', ref:'Check your progress + textbook', pages:'11',
html:`
<p>Exam questions often give a full equation and ask “which element is <b>oxidized</b>?” Assign numbers to <b>every</b> element and look for the one that <b>increases</b>.</p>
<div class="ex"><h5>Example</h5><div class="eq">CuO + H₂ → Cu + H₂O</div>
<p>Cu: +2 → 0 (reduced) · H: 0 → +1 (<b>oxidized</b>) · O: −2 → −2 (unchanged)</p></div>
<div class="ex"><h5>Observation question</h5><p>Copper wire in silver nitrate solution: the solution turns <b>blue</b> and silver crystals form. The blue colour = Cu²⁺(aq), so <b>Cu is oxidized</b> (0 → +2).</p></div>
<div class="ex"><h5>Is it even redox?</h5>
<div class="eq">AgNO₃ + NaCl → AgCl + NaNO₃</div><p>Ag +1 → +1, Cl −1 → −1, Na +1 → +1 … <b>no change → NOT a redox reaction</b> (double displacement / precipitation). Acid–base neutralizations are also not redox.</p></div>
<div class="tip">📌 A reaction that contains an <b>element</b> (on either side) is almost always redox.</div>`,
checks:[
{q:'Which element is oxidized in 2KI + Cl₂ → 2KCl + I₂?',o:['I','Cl','K','None'],a:0,e:'I: −1 → 0 (increase = oxidation). Cl: 0 → −1 (reduced). K stays +1.',w:['','Cl decreases → reduced.','K stays +1 (spectator).','I changes, so oxidation happens.']},
{q:'Which reaction is NOT a redox reaction?',o:['NaOH + HCl → NaCl + H₂O','Zn + 2HCl → ZnCl₂ + H₂','2Na + Cl₂ → 2NaCl','CH₄ + 2O₂ → CO₂ + 2H₂O'],a:0,e:'In neutralization, all oxidation numbers stay the same (Na +1, O −2, H +1, Cl −1).',w:['','Zn 0 → +2; H +1 → 0: redox.','Na 0 → +1; Cl 0 → −1: redox.','C −4 → +4; O 0 → −2: redox (combustion).']},
{q:'When sulfur changes from −2 to +6, how many electrons are lost per S atom?',o:['8','4','6','2'],a:0,e:'+6 − (−2) = 8.',w:['','Subtract correctly: 6 − (−2) = 8.','6 ignores the starting −2.','2 ignores most of the change.']}
]});

L.push({
id:11, unit:'B', title:'Recognizing reduction & spectator ions',
outcome:'Distinguish between oxidation and reduction in terms of change in oxidation number', ref:'Check your progress + textbook', pages:'11',
html:`
<p>Look for the element whose oxidation number <b>decreases</b> → that element is <b>reduced</b>. Elements that do not change are <b>spectators</b>.</p>
<div class="ex"><h5>Example</h5><div class="eq">2KI + Cl₂ → 2KCl + I₂</div>
<p>Cl: 0 → −1 (<b>reduced</b>) · I: −1 → 0 (oxidized) · K: +1 → +1 (spectator)</p>
<p>Net ionic equation (spectators removed): <span class="eq-in">2I⁻ + Cl₂ → I₂ + 2Cl⁻</span></p></div>
<div class="ex"><h5>Same element oxidized AND reduced (disproportionation)</h5>
<div class="eq">Cl₂ + 2NaOH → NaCl + NaClO + H₂O</div>
<p>One Cl: 0 → −1 (reduced); the other Cl: 0 → +1 (oxidized). Cl₂ is both the oxidizing and the reducing agent.</p></div>
<div class="ex"><h5>Hydrogen from acids</h5><div class="eq">Fe + 2HBr → FeBr₂ + H₂</div><p>H: +1 → 0 (<b>reduced</b>). Fe: 0 → +2 (oxidized). Br stays −1.</p></div>`,
checks:[
{q:'In Cl₂ + 2Br⁻ → 2Cl⁻ + Br₂, which element is reduced?',o:['Cl','Br','Both','Neither'],a:0,e:'Cl: 0 → −1 (decrease = reduction). Br: −1 → 0 (oxidized).',w:['','Br increases (−1 → 0) → oxidized.','Only Cl decreases.','Both change, so redox happens.']},
{q:'In Fe + 2HBr → FeBr₂ + H₂, which change shows reduction?',o:['H: +1 → 0','Fe: 0 → +2','Br: −1 → 0','H: 0 → +1'],a:0,e:'Hydrogen falls from +1 (in HBr) to 0 (in H₂).',w:['','This is oxidation (increase).','Br stays −1 in FeBr₂.','Direction reversed: H starts at +1 in HBr.']},
{q:'In Cl₂ + 2OH⁻ → Cl⁻ + ClO⁻ + H₂O, chlorine is…',o:['both oxidized and reduced','only oxidized','only reduced','neither oxidized nor reduced'],a:0,e:'0 → −1 in Cl⁻ (reduced) and 0 → +1 in ClO⁻ (oxidized): disproportionation.',w:['','It is also reduced (to Cl⁻).','It is also oxidized (to ClO⁻).','Oxidation numbers change from 0.']}
]});

L.push({
id:12, unit:'C', title:'Steps of the half-reaction method (acidic solution)',
outcome:'Describe the steps for balancing redox reactions, in acidic medium, by the half-reaction method', ref:'Table 6', pages:'17',
video:{id:'N6ivvu6xlog', t:'Balancing redox in acidic & basic solution (from Mr. Luke\'s lesson)'},
fig:'acidsteps',
html:`
<div class="key"><h4>Table 6 — Balancing by the half-reaction method</h4>
<ol class="rules">
<li>Write the <b>net ionic equation</b> (omit spectator ions).</li>
<li>Split it into an <b>oxidation half</b> and a <b>reduction half</b>.</li>
<li>Balance <b>each</b> half-reaction:
 <ol type="a"><li>atoms other than O and H</li><li><b>O</b> by adding <b>H₂O</b></li><li><b>H</b> by adding <b>H⁺</b></li><li><b>charge</b> by adding <b>e⁻</b></li></ol></li>
<li>Multiply so <b>electrons lost = electrons gained</b>.</li>
<li><b>Add</b> the halves, cancel e⁻ (and anything on both sides), return spectator ions, <b>check atoms and charge</b>.</li></ol>
<p class="mnemo">🧠 Order to remember: <b>“Other atoms → O → H → charge”</b> &nbsp;=&nbsp; <b>X → H₂O → H⁺ → e⁻</b></p></div>
<div class="ex"><h5>Half-reaction: MnO₄⁻ → Mn²⁺ (acid)</h5>
<ol><li>Mn already balanced.</li><li>4 O on left → add <b>4H₂O</b> on right: MnO₄⁻ → Mn²⁺ + 4H₂O</li>
<li>8 H on right → add <b>8H⁺</b> on left: MnO₄⁻ + 8H⁺ → Mn²⁺ + 4H₂O</li>
<li>Charge: left = −1 + 8 = +7; right = +2 → add <b>5e⁻</b> to the left.</li></ol>
<div class="eq good">MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O</div></div>
<div class="ex"><h5>From the slides: NO₃⁻ → NH₄⁺</h5>
<div class="eq good">NO₃⁻ + 10H⁺ + 8e⁻ → NH₄⁺ + 3H₂O</div>
<h5>AsH₃ → H₃AsO₃</h5><div class="eq good">AsH₃ + 3H₂O → H₃AsO₃ + 6H⁺ + 6e⁻</div></div>
<div class="trap">⚠️ The electrons go on the side that is <b>more positive</b>. Reduction → e⁻ on the <b>left</b>; oxidation → e⁻ on the <b>right</b>.</div>`,
checks:[
{q:'In acidic solution, oxygen atoms in a half-reaction are balanced by adding…',o:['H₂O','H⁺','OH⁻','O₂'],a:0,e:'O is balanced with water; then H is balanced with H⁺.',w:['','H⁺ balances hydrogen, not oxygen.','OH⁻ is only used when converting to basic solution.','You never add O₂ to balance — it would change the chemistry.']},
{q:'Find x: Cr₂O₇²⁻ + 14H⁺ + x e⁻ → 2Cr³⁺ + 7H₂O',o:['6','3','12','7'],a:0,e:'Left charge before e⁻: −2 + 14 = +12. Right: 2(+3) = +6. Need 6e⁻ on the left.',w:['','3 is for one Cr atom only — there are two.','12 is the charge, not the electron count.','7 is the number of water molecules.']},
{q:'What is the correct ORDER inside step 3 of the method?',o:['Other atoms → O (H₂O) → H (H⁺) → charge (e⁻)','Charge → O → H → other atoms','H → O → charge → other atoms','O → other atoms → charge → H'],a:0,e:'Balance non-O/H atoms first, then O with H₂O, then H with H⁺, then charge with electrons.',w:['','Charge must be balanced LAST, after all atoms.','H must come after O (adding H₂O adds H).','Other atoms come first, and H before charge.']}
]});

L.push({
id:13, unit:'C', title:'Writing oxidation and reduction half-reactions',
outcome:'Write oxidation-half reaction and reduction-half reaction for a redox reaction', ref:'Figure 8 + textbook + Table 5', pages:'16, 17',
video:{id:'5rtJdjas-mY', t:'Half equations (from Mr. Luke\'s lesson)'},
html:`
<p>A <b>half-reaction</b> is one of the two parts of a redox reaction.</p>
<ul class="bul"><li><b>Oxidation half-reaction</b> shows the electrons <b>lost</b> → e⁻ on the <b>right</b>: <span class="eq-in">A → A⁺ + e⁻</span></li>
<li><b>Reduction half-reaction</b> shows the electrons <b>gained</b> → e⁻ on the <b>left</b>: <span class="eq-in">B + e⁻ → B⁻</span></li></ul>
<div class="ex"><h5>Example — Fe + Cu²⁺</h5><div class="eq">Fe(s) + Cu²⁺(aq) → Fe²⁺(aq) + Cu(s)</div>
<p>Oxidation: <span class="eq-in">Fe → Fe²⁺ + 2e⁻</span> &nbsp; Reduction: <span class="eq-in">Cu²⁺ + 2e⁻ → Cu</span></p></div>
<div class="ex"><h5>Example — Cr + Ag⁺ (unequal electrons)</h5>
<p>Cr → Cr³⁺ + 3e⁻ (×1) &nbsp;&nbsp; Ag⁺ + e⁻ → Ag (×3)</p><div class="eq good">Cr + 3Ag⁺ → Cr³⁺ + 3Ag</div></div>
<div class="ex"><h5>More from the slides</h5>
<p>Sn⁴⁺ + Fe²⁺ → Sn²⁺ + Fe³⁺: reduction <span class="eq-in">Sn⁴⁺ + 2e⁻ → Sn²⁺</span>; oxidation <span class="eq-in">Fe²⁺ → Fe³⁺ + e⁻</span></p>
<p>Ca + Cl₂ → CaCl₂: reduction <span class="eq-in">Cl₂ + 2e⁻ → 2Cl⁻</span>; oxidation <span class="eq-in">Ca → Ca²⁺ + 2e⁻</span></p></div>
<div class="trap">⚠️ A half-reaction always contains electrons. A complete redox equation never shows electrons (they cancel).</div>`,
checks:[
{q:'Which is the oxidation half-reaction for Ni(s) + Cu²⁺(aq) → Ni²⁺(aq) + Cu(s)?',o:['Ni → Ni²⁺ + 2e⁻','Cu²⁺ + 2e⁻ → Cu','Ni²⁺ + 2e⁻ → Ni','Cu → Cu²⁺ + 2e⁻'],a:0,e:'Ni loses 2 electrons; electrons appear on the right in oxidation.',w:['','This is the reduction half (electrons gained).','This is the reverse of what happens to Ni.','Cu is formed, not consumed.']},
{q:'Which equation is a complete redox reaction, not a half-reaction?',o:['2Fe + 3Cl₂ → 2FeCl₃','Cl₂ + 2e⁻ → 2Cl⁻','Fe → Fe³⁺ + 3e⁻','2H⁺ + 2e⁻ → H₂'],a:0,e:'It contains no free electrons — both oxidation (Fe) and reduction (Cl₂) are combined.',w:['','Shows electrons → half-reaction.','Shows electrons → half-reaction.','Shows electrons → half-reaction.']},
{q:'Correct reduction half-reaction for Sn⁴⁺ + 2Fe²⁺ → Sn²⁺ + 2Fe³⁺?',o:['Sn⁴⁺ + 2e⁻ → Sn²⁺','Fe²⁺ → Fe³⁺ + e⁻','Sn⁴⁺ → Sn²⁺ + 2e⁻','Fe³⁺ + e⁻ → Fe²⁺'],a:0,e:'Sn goes +4 → +2: gains 2 electrons (left side).',w:['','That is the oxidation half.','Electrons must be on the LEFT in reduction; also charge would not balance.','This is the reverse of what happens.']}
]});

L.push({
id:14, unit:'C', title:'Balancing in acid — permanganate reactions',
outcome:'Balance redox reaction in acidic medium using half-reaction method', ref:'Textbook + Example Problem 5 + practice + check your progress', pages:'16, 17, 18, 19',
html:`
<div class="ex"><h5>Worked example: MnO₄⁻ + Fe²⁺ → Mn²⁺ + Fe³⁺ (acid)</h5>
<ol><li>Reduction: <span class="eq-in">MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O</span></li>
<li>Oxidation: <span class="eq-in">Fe²⁺ → Fe³⁺ + e⁻</span> → ×5</li>
<li>Add, cancel 5e⁻:</li></ol>
<div class="eq good">MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</div>
<p>Charge check: left −1 + 8 + 10 = <b>+17</b>; right +2 + 15 = <b>+17</b> ✔</p></div>
<div class="ex"><h5>Worked example: Cu + NO₃⁻ → Cu²⁺ + NO (acid) — from the slides</h5>
<ol><li>Oxidation: Cu → Cu²⁺ + 2e⁻ &nbsp;(×3)</li>
<li>Reduction: NO₃⁻ + 4H⁺ + 3e⁻ → NO + 2H₂O &nbsp;(×2)</li></ol>
<div class="eq good">3Cu + 2NO₃⁻ + 8H⁺ → 3Cu²⁺ + 2NO + 4H₂O</div></div>
<div class="ex"><h5>More to recognise</h5>
<div class="eq">2MnO₄⁻ + 10Cl⁻ + 16H⁺ → 2Mn²⁺ + 5Cl₂ + 8H₂O</div>
<div class="eq">2MnO₄⁻ + 5H₂C₂O₄ + 6H⁺ → 2Mn²⁺ + 10CO₂ + 8H₂O</div>
<div class="eq">5SeO₃²⁻ + 2ClO₃⁻ + 2H⁺ → 5SeO₄²⁻ + Cl₂ + H₂O</div></div>
<div class="tip">📌 Final check = <b>atoms</b> on both sides <b>and</b> total <b>charge</b> on both sides. If the charge doesn’t match, an electron count is wrong.</div>`,
checks:[
{q:'In the balanced acidic equation MnO₄⁻ + Fe²⁺ → Mn²⁺ + Fe³⁺, what is the coefficient of Fe²⁺?',o:['5','1','8','4'],a:0,e:'Mn gains 5e⁻; each Fe²⁺ gives 1e⁻, so 5 Fe²⁺ are needed.',w:['','Electrons would not be balanced (5 gained vs 1 lost).','8 is the coefficient of H⁺.','4 is the coefficient of H₂O.']},
{q:'For 3Cu + 2NO₃⁻ + _H⁺ → 3Cu²⁺ + 2NO + 4H₂O, the H⁺ coefficient is…',o:['8','4','2','6'],a:0,e:'4 H₂O contain 8 H, so 8H⁺ on the left. Charge: −2 + 8 = +6 = 3(+2) ✔',w:['','4 H⁺ would only make 2 H₂O.','2 H⁺ would only make 1 H₂O.','6 does not balance H or charge.']},
{q:'What is the total charge on EACH side of MnO₄⁻ + 8H⁺ + 5Fe²⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O?',o:['+17','+12','+7','0'],a:0,e:'Left: −1 + 8 + 10 = +17. Right: +2 + 15 = +17.',w:['','Recount the Fe²⁺: 5 × (+2) = +10.','+7 is the left side of the half-reaction before electrons.','Ions are present, so the total charge is not zero.']}
]});

L.push({
id:15, unit:'C', title:'Balancing in acid — dichromate & other reactions',
outcome:'Balance redox reaction in acidic medium using half-reaction method', ref:'Textbook + Example Problem 5 + practice', pages:'16, 17, 18',
html:`
<div class="ex"><h5>Worked example: Cr₂O₇²⁻ + I⁻ → Cr³⁺ + I₂ (acid)</h5>
<ol><li>Reduction: <span class="eq-in">Cr₂O₇²⁻ + 14H⁺ + 6e⁻ → 2Cr³⁺ + 7H₂O</span></li>
<li>Oxidation: <span class="eq-in">2I⁻ → I₂ + 2e⁻</span> → ×3</li></ol>
<div class="eq good">Cr₂O₇²⁻ + 14H⁺ + 6I⁻ → 2Cr³⁺ + 3I₂ + 7H₂O</div><p>Charge: −2 + 14 − 6 = <b>+6</b>; right 2(+3) = <b>+6</b> ✔</p></div>
<div class="ex"><h5>Dichromate + Fe²⁺</h5><div class="eq good">Cr₂O₇²⁻ + 14H⁺ + 6Fe²⁺ → 2Cr³⁺ + 6Fe³⁺ + 7H₂O</div></div>
<div class="ex"><h5>Water can appear on the LEFT</h5>
<p>I₂ + S₂O₃²⁻ → S₂O₄²⁻ + I⁻:</p>
<p>Oxidation: S₂O₃²⁻ + H₂O → S₂O₄²⁻ + 2H⁺ + 2e⁻ &nbsp; Reduction: I₂ + 2e⁻ → 2I⁻</p>
<div class="eq good">I₂ + S₂O₃²⁻ + H₂O → S₂O₄²⁻ + 2I⁻ + 2H⁺</div></div>
<div class="ex"><h5>Hydrogen peroxide as oxidizing agent</h5><div class="eq good">H₂O₂ + 2Fe²⁺ + 2H⁺ → 2Fe³⁺ + 2H₂O</div></div>
<div class="trap">⚠️ For Cr₂O₇²⁻ remember there are <b>two</b> Cr atoms: balance Cr first (2Cr³⁺), so the electrons are <b>6</b>, not 3.</div>`,
checks:[
{q:'In Cr₂O₇²⁻ + 14H⁺ + 6I⁻ → 2Cr³⁺ + _I₂ + _H₂O, the coefficients of I₂ and H₂O are…',o:['3 and 7','6 and 7','3 and 14','1 and 7'],a:0,e:'6 I⁻ make 3 I₂; 7 O atoms make 7 H₂O.',w:['','6 I⁻ give 3 I₂ molecules (each has 2 I).','14 is H⁺; water is 7.','1 I₂ only uses 2 I⁻ (2e⁻), not 6.']},
{q:'How many electrons are gained by one Cr₂O₇²⁻ when it forms 2Cr³⁺?',o:['6','3','2','14'],a:0,e:'Each Cr: +6 → +3 (3e⁻) × 2 Cr = 6e⁻.',w:['','3 is for ONE Cr atom.','No — check the change for Cr.','14 is the H⁺ coefficient.']},
{q:'Balanced: H₂O₂ + _Fe²⁺ + 2H⁺ → _Fe³⁺ + 2H₂O. The missing coefficient (same for both) is…',o:['2','1','4','3'],a:0,e:'H₂O₂ + 2H⁺ + 2e⁻ → 2H₂O; 2 Fe²⁺ supply 2e⁻.',w:['','1 Fe²⁺ only supplies 1e⁻ — charge would not balance.','4 gives too many electrons.','3 gives too many electrons.']}
]});

L.push({
id:16, unit:'C', title:'Steps for balancing in BASIC solution',
outcome:'Describe the steps for balancing redox reactions, in basic medium, by the half-reaction method', ref:'Textbook + Example Problem 5 + practice + check your progress', pages:'16, 17, 18, 19',
fig:'basesteps',
html:`
<div class="key"><h4>Method: balance as if acidic, then neutralize H⁺</h4>
<ol class="rules"><li>Do all the acidic steps (X → H₂O → H⁺ → e⁻, match e⁻, add).</li>
<li>For every <b>H⁺</b>, add the <b>same number of OH⁻ to BOTH sides</b>.</li>
<li>Combine <b>H⁺ + OH⁻ → H₂O</b> on the side that had H⁺.</li>
<li><b>Cancel</b> water molecules that appear on both sides.</li>
<li>Check: <b>no H⁺</b> left, atoms and charge balanced.</li></ol></div>
<div class="ex"><h5>Half-reaction: MnO₄⁻ → MnO₂ (base)</h5>
<p>Acid version: MnO₄⁻ + 4H⁺ + 3e⁻ → MnO₂ + 2H₂O</p>
<p>Add 4OH⁻ both sides: MnO₄⁻ + <b>4H₂O</b> + 3e⁻ → MnO₂ + 2H₂O + 4OH⁻</p>
<p>Cancel 2H₂O:</p><div class="eq good">MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻</div></div>
<div class="ex"><h5>From the slides: CrO₄²⁻ → Cr(OH)₃ (base)</h5>
<div class="eq good">CrO₄²⁻ + 4H₂O + 3e⁻ → Cr(OH)₃ + 5OH⁻</div>
<h5>Ag₂O₃ → AgO (base)</h5><div class="eq good">Ag₂O₃ + H₂O + 2e⁻ → 2AgO + 2OH⁻</div></div>
<div class="trap">⚠️ Add OH⁻ to <b>both</b> sides — adding to one side only breaks the balance.</div>`,
checks:[
{q:'To convert an acid-balanced equation to basic conditions you add, to BOTH sides, the same number of…',o:['OH⁻ as there are H⁺','H₂O as there are H⁺','e⁻ as there are H⁺','O₂ as there are H⁺'],a:0,e:'OH⁻ neutralizes H⁺ forming water; adding to both sides keeps it balanced.',w:['','Water does not remove H⁺.','Electrons are already balanced.','O₂ is never added for balancing.']},
{q:'An acid-balanced equation has 3H⁺ and 1H₂O on the product side. After converting to base, the product side has…',o:['4H₂O','3H₂O','1H₂O and 3OH⁻','2H₂O'],a:0,e:'3H⁺ + 3OH⁻ → 3H₂O, plus the existing 1H₂O = 4H₂O (3OH⁻ appear on the reactant side).',w:['','Forgot the H₂O already there.','The H⁺ and OH⁻ combine into water.','Count again: 3 + 1 = 4.']},
{q:'Which species must NOT appear in a final equation balanced in basic solution?',o:['H⁺','OH⁻','H₂O','e⁻ in a half-reaction'],a:0,e:'Basic solution has almost no H⁺ — all H⁺ must be converted to water using OH⁻.',w:['','OH⁻ is exactly what basic solutions contain.','Water is fine in any solution.','Half-reactions always contain electrons.']}
]});

L.push({
id:17, unit:'C', title:'Balancing full equations in BASIC solution',

html:`
<div class="ex"><h5>Worked example: MnO₄⁻ + SO₃²⁻ → MnO₂ + SO₄²⁻ (base)</h5>
<ol><li>Reduction (base): MnO₄⁻ + 2H₂O + 3e⁻ → MnO₂ + 4OH⁻ &nbsp;(×2)</li>
<li>Oxidation (base): SO₃²⁻ + 2OH⁻ → SO₄²⁻ + H₂O + 2e⁻ &nbsp;(×3)</li>
<li>Add: 2MnO₄⁻ + 4H₂O + 3SO₃²⁻ + 6OH⁻ → 2MnO₂ + 8OH⁻ + 3SO₄²⁻ + 3H₂O</li>
<li>Cancel 3H₂O and 6OH⁻:</li></ol>
<div class="eq good">2MnO₄⁻ + 3SO₃²⁻ + H₂O → 2MnO₂ + 3SO₄²⁻ + 2OH⁻</div><p>Charge: −2 − 6 = <b>−8</b>; right −6 − 2 = <b>−8</b> ✔</p></div>

L.push({
id:18, unit:'D', title:'Electrochemical cells and their types',
outcome:'Describe an electrochemical cell while specifying its types', ref:'Figures 1, 2 + textbook', pages:'25, 26',
video:{id:'teTkvUtW4SA', t:'Introduction to Electrochemistry — Tyler DeWitt'},
fig:'voltaic',
html:`
<div class="key"><h4>Definition</h4><p>An <b>electrochemical cell</b> is an apparatus that uses a <b>redox reaction</b> to <b>produce electrical energy</b>, or uses <b>electrical energy</b> to cause a chemical reaction.</p></div>
<div class="two"><div class="card c1"><h4>⚡ Voltaic (galvanic) cell</h4><ul><li>Converts <b>chemical → electrical</b> energy</li><li><b>Spontaneous</b> redox reaction</li><li>E°cell <b>positive</b></li><li>Anode <b>−</b>, cathode <b>+</b></li><li>Example: batteries, Zn–Cu (Daniell) cell</li></ul></div>
<div class="card c2"><h4>🔌 Electrolytic cell</h4><ul><li>Converts <b>electrical → chemical</b> energy</li><li><b>Non-spontaneous</b> reaction driven by a power supply</li><li>Anode <b>+</b>, cathode <b>−</b></li><li>Example: electrolysis, electroplating, recharging</li></ul></div></div>
<p>Why separate the two half-reactions? If zinc is put straight into CuSO₄ solution, electrons move directly from Zn to Cu²⁺ and only <b>heat</b> is released. Separating them into two <b>half-cells</b> forces the electrons to flow through an <b>external wire</b> → electric current you can use.</p>`,
checks:[
{q:'A Zn–Cu cell lights a bulb with no external power source. What type of cell is it?',o:['Voltaic (galvanic) — chemical → electrical energy','Electrolytic — electrical → chemical energy','Electrolytic — chemical → electrical energy','Voltaic — electrical → chemical energy'],a:0,e:'It produces electricity from a spontaneous reaction: voltaic cell.',w:['','Electrolytic cells need an external power supply.','Wrong type AND wrong conversion.','Voltaic cells produce electrical energy, not consume it.']},
{q:'Which energy conversion is the basis of ALL electrochemical cells?',o:['Between chemical and electrical energy','Between mechanical and electrical energy','Between light and chemical energy','Between nuclear and thermal energy'],a:0,e:'Voltaic: chemical → electrical. Electrolytic: electrical → chemical.',w:['','That is a generator/motor.','That is photosynthesis / solar cells.','That is a nuclear reactor.']},
{q:'Which describes an electrolytic cell?',o:['Uses electrical energy to drive a non-spontaneous reaction','Produces electricity from a spontaneous reaction','Has a negative cathode and positive anode only because the reaction is spontaneous','Never involves redox'],a:0,e:'Electrolytic cells use an external power source to force non-spontaneous redox reactions.',w:['','That is a voltaic cell.','Its signs come from the power supply, and the reaction is non-spontaneous.','Electrolysis is a redox process.']}
]});

L.push({
id:19, unit:'D', title:'Parts of a voltaic cell, electron & current flow',
outcome:'Identify components of a voltaic or galvanic cell (anode, cathode, salt bridge or porous barrier, wires, electrolyte compartments); while explaining the role of each component, when does the reaction start and determining the direction of electron and current flow', ref:'Figures 1, 2 + textbook', pages:'25, 26',
video:{id:'7b34XYgADlM', t:'Galvanic (Voltaic) Cells — Tyler DeWitt'},
fig:'voltaic',
html:`
<div class="key"><h4>Components and their roles</h4>
<table class="tbl"><tr><th>Part</th><th>Role</th></tr>
<tr><td><b>Anode</b> (Zn)</td><td>Electrode where <b>oxidation</b> occurs; source of electrons; <b>negative</b>; loses mass</td></tr>
<tr><td><b>Cathode</b> (Cu)</td><td>Electrode where <b>reduction</b> occurs; electrons arrive; <b>positive</b>; gains mass</td></tr>
<tr><td><b>Electrolyte compartments</b> (half-cells)</td><td>Solutions of ions (ZnSO₄, CuSO₄) — supply the ions that react and conduct by ion movement</td></tr>
<tr><td><b>Wire</b> (external circuit)</td><td>Carries <b>electrons</b> from anode to cathode</td></tr>
<tr><td><b>Salt bridge / porous barrier</b></td><td>Lets <b>ions</b> pass to keep each half-cell <b>electrically neutral</b> and completes the circuit, while stopping the solutions mixing</td></tr></table></div>
<div class="two"><div class="card c1"><h4>Directions</h4><ul><li><b>Electrons:</b> anode → cathode through the <b>wire</b> (Zn → Cu)</li><li><b>Conventional current:</b> cathode → anode in the wire (opposite to electrons)</li><li><b>Anions</b> in salt bridge → toward the <b>anode</b></li><li><b>Cations</b> in salt bridge → toward the <b>cathode</b></li></ul></div>
<div class="card c2"><h4>When does the reaction start?</h4><p>Only when the circuit is <b>complete</b> — the electrodes are connected by the <b>wire</b> AND the <b>salt bridge</b> (or porous barrier) is in place. Remove either one → the flow of electrons stops.</p></div></div>
<div class="mnemo">🧠 <b>AN OX</b> and <b>RED CAT</b> · electrons flow <b>A → C</b> (alphabetical!) · “<b>F</b>at <b>C</b>at” — electrons flow <b>F</b>rom <b>A</b>node <b>T</b>o <b>C</b>athode</div>
<div class="trap">⚠️ Electrons <b>never</b> travel through the solution or salt bridge — only <b>ions</b> move there.</div>`,
checks:[
{q:'In a working Zn–Cu voltaic cell, electrons flow…',o:['from Zn to Cu through the wire','from Cu to Zn through the wire','through the salt bridge from Zn to Cu','through the salt bridge from Cu to Zn'],a:0,e:'Electrons leave the anode (Zn, oxidation) and travel through the external wire to the cathode (Cu).',w:['','That is the direction of conventional current.','Electrons never move through the salt bridge — only ions.','Electrons never move through the salt bridge.']},
{q:'What is the role of the salt bridge?',o:['Allows ions to flow to keep the half-cells electrically neutral','Carries electrons between the electrodes','Supplies the electrons for reduction','Speeds up the reaction as a catalyst'],a:0,e:'Ion migration through the salt bridge balances the charge build-up and completes the circuit.',w:['','The wire carries electrons.','Electrons come from the anode.','It is not a catalyst.']},
{q:'In the salt bridge of a Zn–Cu cell, anions move toward…',o:['the zinc anode','the copper cathode','the voltmeter','both electrodes equally'],a:0,e:'Zn²⁺ ions are produced at the anode, making that half-cell positive; anions move there to neutralize it.',w:['','Cations move toward the cathode, where Cu²⁺ is removed.','Ions do not move into the external circuit.','They move toward the anode compartment.']}
]});

L.push({
id:20, unit:'D', title:'Half-reactions at the anode and cathode',
outcome:'Write the oxidation and reduction half-reactions occurring at cathode and anode for a voltaic cell', ref:'Textbook + Figure 6', pages:'27, 31',
html:`
<div class="key"><h4>Rule</h4><p><b>Anode = oxidation</b> (e⁻ on the right). <b>Cathode = reduction</b> (e⁻ on the left). True for <b>every</b> cell.</p></div>
<div class="ex"><h5>Zn–Cu cell</h5>
<p>Anode (oxidation): <span class="eq-in">Zn(s) → Zn²⁺(aq) + 2e⁻</span></p>
<p>Cathode (reduction): <span class="eq-in">Cu²⁺(aq) + 2e⁻ → Cu(s)</span></p>
<div class="eq good">Overall: Zn(s) + Cu²⁺(aq) → Zn²⁺(aq) + Cu(s)</div></div>
<div class="ex"><h5>Unequal electrons: 2Fe³⁺ + 3Mn → 3Mn²⁺ + 2Fe</h5>
<p>Anode: Mn → Mn²⁺ + 2e⁻ (×3) &nbsp; Cathode: Fe³⁺ + 3e⁻ → Fe (×2) → 6e⁻ each</p></div>
<div class="ex"><h5>Hydrogen electrode (Figure 6)</h5><p>With Zn: SHE is the cathode: 2H⁺ + 2e⁻ → H₂. With Cu: SHE is the anode: H₂ → 2H⁺ + 2e⁻.</p></div>
<div class="tip">📌 Observations: anode metal gets <b>thinner</b> (loses mass); cathode metal gets <b>thicker</b> (gains mass); blue Cu²⁺ solution gets <b>paler</b>.</div>`,

{q:'Which electrode gains mass in a working Zn–Cu voltaic cell?',o:['Copper cathode','Zinc anode','Both','Neither'],a:0,e:'Cu²⁺ is reduced and deposits as Cu metal on the cathode.',w:['','Zinc dissolves as Zn²⁺ → loses mass.','The zinc anode loses mass.','The cathode gains copper.']}
