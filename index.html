// ---------- RUNNER ----------
var RUN=null,TIMER=null;
function stopTimer(){if(TIMER){clearInterval(TIMER);TIMER=null;}}
function examStart(id){
  var x=EXS.filter(function(e){return e.id===id;})[0];
  var h='<div class="crumbs"><a href="#exams">Exams</a> › '+x.name+'</div><div class="card start" style="--c:'+x.color+'"><div class="pill" style="background:var(--c)">'+x.level+' · '+x.tag+'</div><h1>'+x.name+'</h1><p>'+esc(x.desc)+'</p>'+
  '<h3>Choose your mode</h3><div class="modes">'+
  '<label class="mode"><input type="radio" name="md" value="practice" '+(x.realistic?'':'checked')+'><div><b>🧑‍🏫 Practice mode</b><small>Instant feedback after every question: you see if you are right, why a wrong choice is wrong, and the explanation.</small></div></label>'+
  '<label class="mode"><input type="radio" name="md" value="exam" '+(x.realistic?'checked':'')+'><div><b>🎓 Exam mode</b><small>Like the real test: no feedback until you submit. Change answers, flag questions, then see full review.</small></div></label></div>'+
  '<div class="opts2"><label><input type="checkbox" id="optTimer" '+(x.realistic?'checked':'')+'> ⏱ 120-minute timer</label><label><input type="checkbox" id="optShuf"> 🔀 Shuffle question order (real exam may differ)</label></div>'+
  '<button class="btn big" id="go">Start '+x.name+' →</button></div>';
  view(h);
  $('#go').onclick=function(){startRun({title:x.name+' · '+x.level,examId:x.id,keys:x.qs.map(function(_,i){return 'x'+x.id+'_'+i;}),mode:$('input[name=md]:checked').value,timer:$('#optTimer').checked?120*60:0,shuffle:$('#optShuf').checked});};}
function unitPractice(u){
  var keys=[];unitGoals(u).forEach(function(g){g.checks.forEach(function(_,i){keys.push('c'+g.id+'_'+i);});});
  var U=UNITS.filter(function(x){return x.id===u;})[0];
  startRun({title:'Unit '+u+' practice · '+U.name,keys:keys,mode:'practice',timer:0,shuffle:true});}
function startRun(o){
  RUN={opts:o,title:o.title,examId:o.examId,keys:o.shuffle?shuffle(o.keys):o.keys.slice(),mode:o.mode,ans:{},flag:{},checked:{},i:0,left:o.timer,timed:!!o.timer,start:Date.now(),back:o.back||'#exams'};
  PERM={};renderRun();
  if(RUN.timed){TIMER=setInterval(function(){RUN.left--;var t=$('#tmr');if(t)t.textContent=fmt(RUN.left);if(RUN.left<=300&&t)t.classList.add('low');if(RUN.left<=0){stopTimer();toast('⏰ Time is up — submitting.');finishRun();}},1000);}}
function fmt(s){s=Math.max(0,s);var m=Math.floor(s/60),x=s%60;return (m<10?'0':'')+m+':'+(x<10?'0':'')+x;}
function renderRun(){
  var R=RUN,k=R.keys[R.i],n=R.keys.length;
  var answered=Object.keys(R.ans).length;
  var h='<div class="runbar"><div><b>'+esc(R.title)+'</b><small>'+(R.mode==='exam'?'Exam mode':'Practice mode')+' · '+answered+'/'+n+' answered</small></div>'+(R.timed?'<div class="tmr" id="tmr">'+fmt(R.left)+'</div>':'')+'<button class="btn sm danger" id="quit">'+(R.mode==='exam'?'Submit':'Finish')+'</button></div>'+
  '<div class="navq">'+R.keys.map(function(kk,j){var c='';if(R.checked[kk]!=null)c=R.checked[kk]?'ok':'no';else if(R.ans[kk]!=null)c='ans';return '<button class="nq '+c+(j===R.i?' cur':'')+(R.flag[kk]?' fl':'')+'" data-j="'+j+'">'+(j+1)+'</button>';}).join('')+'</div>';
  h+=qCard(k,R.i+1,R.mode,R.ans[k]);
  h+='<div class="runnav"><button class="btn ghost" id="prev" '+(R.i===0?'disabled':'')+'>← Previous</button>'+(R.mode==='exam'?'<button class="btn ghost" id="flag">'+(R.flag[k]?'🏳️ Unflag':'🚩 Flag for review')+'</button>':'')+'<button class="btn" id="next">'+(R.i===n-1?(R.mode==='exam'?'Review & submit':'Finish'):'Next →')+'</button></div>';
  view(h);
  var card=$('.qcard');
  if(R.mode==='practice'&&R.checked[k]!=null)reveal(card,R.ans[k]);
  card.addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;
    if(b.getAttribute('data-act')==='report')return openReport(k);
    if(!b.classList.contains('opt')||b.disabled)return;var oi=+b.getAttribute('data-oi');
    R.ans[k]=oi;
    if(R.mode==='practice'){R.checked[k]=reveal(card,oi);updNav();}
    else{$$('.opt',card).forEach(function(x){x.classList.toggle('sel',x===b);});updNav();}});
  $$('.nq').forEach(function(b){b.onclick=function(){R.i=+b.getAttribute('data-j');renderRun();};});
  $('#prev').onclick=function(){if(R.i>0){R.i--;renderRun();}};
  $('#next').onclick=function(){if(R.i<n-1){R.i++;renderRun();}else confirmFinish();};
  if($('#flag'))$('#flag').onclick=function(){R.flag[k]=!R.flag[k];renderRun();};
  $('#quit').onclick=confirmFinish;}
function updNav(){var R=RUN;$$('.nq').forEach(function(b,j){var kk=R.keys[j];b.className='nq'+(R.checked[kk]!=null?(R.checked[kk]?' ok':' no'):(R.ans[kk]!=null?' ans':''))+(j===R.i?' cur':'')+(R.flag[kk]?' fl':'');});
  var s=$('.runbar small');if(s)s.textContent=(R.mode==='exam'?'Exam mode':'Practice mode')+' · '+Object.keys(R.ans).length+'/'+R.keys.length+' answered';}
function confirmFinish(){
  var R=RUN,un=R.keys.length-Object.keys(R.ans).length,fl=Object.keys(R.flag).filter(function(k){return R.flag[k];}).length;
  var m=$('#modal');m.innerHTML='<div class="mbox"><h3>Finish now?</h3><p>'+(un?'<b>'+un+'</b> question(s) unanswered (they score 0). ':'All questions answered. ')+(fl?'<b>'+fl+'</b> flagged for review.':'')+'</p><div class="row"><button class="btn" id="fyes">Yes, show my results</button><button class="btn ghost" id="fno">Keep working</button></div></div>';
  m.classList.add('show');$('#fno').onclick=function(){m.classList.remove('show');};$('#fyes').onclick=function(){m.classList.remove('show');finishRun();};}
function finishRun(){
  stopTimer();var R=RUN;var score=0,total=0,right=0,per=[];
  R.keys.forEach(function(k){var q=getQ(k);var mk=marks(q.g);total+=mk;var ok=R.ans[k]===q.a;if(ok){score+=mk;right++;delete S.mistakes[k];}else if(R.ans[k]!=null||R.examId){S.mistakes[k]={t:Date.now()};}per.push({k:k,q:q,ok:ok});});
  var pct=Math.round(score/total*100);
  if(R.examId){var sc=Math.round(score/total*100);if(S.best[R.examId]==null||sc>S.best[R.examId])S.best[R.examId]=sc;}
  save();
  var mins=Math.round((Date.now()-R.start)/60000);
  var grade=pct>=95?['🏆','Outstanding — full-mark level!']:pct>=85?['🌟','Excellent — nearly there.']:pct>=70?['👍','Good — fix the red goals below.']:pct>=50?['📈','Keep going — review the lessons linked below.']:['💪','Build the basics — start with the lessons below.'];
  var weak=per.filter(function(p){return !p.ok;});
  var h='<div class="card result"><div class="rs"><div class="ring big" style="--p:'+pct+'"><div><b>'+(R.examId?score:right)+'</b><small>'+(R.examId?'/ '+total+' marks':'/ '+R.keys.length+' correct')+'</small></div></div><div><div class="em">'+grade[0]+'</div><h1>'+grade[1]+'</h1><p class="muted">'+esc(R.title)+' · '+right+'/'+R.keys.length+' correct · '+pct+'% · '+mins+' min</p>'+
  '<div class="row"><button class="btn" id="again">↻ Try again</button><a class="btn ghost" href="#mistakes">🔁 Practise my mistakes</a><a class="btn ghost" href="#exams">All exams</a></div></div></div></div>';
  h+='<h2 class="sec">🗺️ Goal map</h2><div class="gmap">'+per.map(function(p,j){return '<a href="#goal-'+p.q.g+'" class="gm '+(p.ok?'ok':'no')+'" title="Goal Q'+p.q.g+'">'+(R.examId?'Q'+p.q.g:j+1)+'</a>';}).join('')+'</div>';
  if(weak.length){var gs={};weak.forEach(function(p){gs[p.q.g]=1;});h+='<div class="card"><h3>📖 Review these lessons</h3><div class="chips">'+Object.keys(gs).map(function(g){return '<a class="chip" href="#goal-'+g+'">Q'+g+' · '+esc(lesson(+g).title)+'</a>';}).join('')+'</div></div>';}
  h+='<h2 class="sec">🔍 Full review</h2>';
  per.forEach(function(p,j){var q=p.q,a=R.ans[p.k];
    h+='<div class="rev '+(p.ok?'ok':'no')+'"><div class="rq"><span class="qnum">'+(j+1)+'</span><b>'+esc(q.q)+'</b><span class="qtag">Q'+q.g+' · '+(p.ok?'+'+marks(q.g):'0')+'/'+marks(q.g)+'</span></div>'+
    (a==null?'<div class="warn">⏭️ Not answered.</div>':(!p.ok?'<div class="warn">⚠️ <b>Your answer: '+esc(q.o[a])+'</b> — '+esc(q.w[a]||'')+'</div>':''))+
    '<div class="expl good">✅ <b>'+esc(q.o[q.a])+'</b> — '+esc(q.e)+'</div><div class="rowr"><a class="tiny" href="#goal-'+q.g+'">📖 Lesson Q'+q.g+'</a><button class="tiny" data-rep="'+p.k+'">🚩 Report</button></div></div>';});
  view(h);var RO=R.opts;$('#again').onclick=function(){if(RO.examId)examStart(RO.examId);else startRun(RO);};$$('[data-rep]').forEach(function(b){b.onclick=function(){openReport(b.getAttribute('data-rep'));};});
  RUN=null;}

// ---------- MISTAKES ----------
function mistakes(){
  var keys=Object.keys(S.mistakes).filter(function(k){return getQ(k);});
  keys.sort(function(a,b){return getQ(a).g-getQ(b).g;});
  var h='<div class="phead"><h1>🔁 Mistakes &amp; Reports</h1><p class="muted">Every question you got wrong is kept here until you answer it correctly. Saved on this device only.</p></div>';
  h+='<div class="card"><div class="uhead"><h2>❌ My mistakes ('+keys.length+')</h2>'+(keys.length?'<button class="btn" id="retry">Retry all mistakes →</button>':'')+'</div>';
  if(!keys.length)h+='<p class="muted">No mistakes saved yet — great work (or go answer some questions!).</p>';
  else{var by={};keys.forEach(function(k){var g=getQ(k).g;(by[g]=by[g]||[]).push(k);});
    h+='<div class="chips">'+Object.keys(by).map(function(g){return '<a class="chip no" href="#goal-'+g+'">Q'+g+' · '+by[g].length+' wrong</a>';}).join('')+'</div>';}
  h+='</div><div class="card"><div class="uhead"><h2>🚩 My reports ('+S.reports.length+')</h2>'+(S.reports.length?'<div class="row"><button class="btn sm" id="copyr">📋 Copy all</button><button class="btn sm ghost" id="clr">Clear</button></div>':'')+'</div>';
  if(!S.reports.length)h+='<p class="muted">Use the 🚩 Report button on any question if you think something is wrong.</p>';
  else{h+='<textarea id="rall" class="rall" readonly>'+esc(S.reports.map(function(r,i){return (i+1)+'. ['+r.src+'] '+r.reason+(r.note?' — '+r.note:'')+'\n   '+r.q;}).join('\n'))+'</textarea>';}
  h+='</div>';view(h);
  if($('#retry'))$('#retry').onclick=function(){startRun({title:'Retry my mistakes',keys:keys,mode:'practice',timer:0,shuffle:true});};
  if($('#copyr'))$('#copyr').onclick=function(){var t=$('#rall');try{navigator.clipboard.writeText(t.value).then(function(){toast('Copied!');},function(){t.select();toast('Select & copy the text');});}catch(e){t.select();toast('Select & copy the text');}};
  if($('#clr'))$('#clr').onclick=function(){S.reports=[];save();mistakes();};}

// ---------- TOOLS ----------
var ETAB=(function(){
 function M(lbl,ion,met,E){return [lbl,ion,met,E,met+'(s) | '+ion+'(aq)',ion+'(aq) | '+met+'(s)'];}
 function X2(lbl,x2,xm,E){return [lbl,x2,xm,E,'Pt | '+xm+'(aq) | '+x2,x2+' | '+xm+'(aq) | Pt'];}
 return [X2('F₂ + 2e⁻ → 2F⁻','F₂(g)','F⁻',2.87),M('Au³⁺ + 3e⁻ → Au','Au³⁺','Au',1.50),X2('Cl₂ + 2e⁻ → 2Cl⁻','Cl₂(g)','Cl⁻',1.36),M('Pt²⁺ + 2e⁻ → Pt','Pt²⁺','Pt',1.18),X2('Br₂ + 2e⁻ → 2Br⁻','Br₂(l)','Br⁻',1.07),M('Hg²⁺ + 2e⁻ → Hg','Hg²⁺','Hg',0.85),M('Ag⁺ + e⁻ → Ag','Ag⁺','Ag',0.80),
 ['Fe³⁺ + e⁻ → Fe²⁺','Fe³⁺','Fe²⁺',0.77,'Pt | Fe²⁺(aq), Fe³⁺(aq)','Fe³⁺(aq), Fe²⁺(aq) | Pt'],X2('I₂ + 2e⁻ → 2I⁻','I₂(s)','I⁻',0.54),M('Cu²⁺ + 2e⁻ → Cu','Cu²⁺','Cu',0.34),
 ['2H⁺ + 2e⁻ → H₂ (SHE)','H⁺','H₂',0.00,'Pt | H₂(g) | H⁺(aq)','H⁺(aq) | H₂(g) | Pt'],M('Pb²⁺ + 2e⁻ → Pb','Pb²⁺','Pb',-0.13),M('Sn²⁺ + 2e⁻ → Sn','Sn²⁺','Sn',-0.14),M('Ni²⁺ + 2e⁻ → Ni','Ni²⁺','Ni',-0.26),M('Co²⁺ + 2e⁻ → Co','Co²⁺','Co',-0.28),M('Cd²⁺ + 2e⁻ → Cd','Cd²⁺','Cd',-0.40),M('Fe²⁺ + 2e⁻ → Fe','Fe²⁺','Fe',-0.45),M('Cr³⁺ + 3e⁻ → Cr','Cr³⁺','Cr',-0.74),M('Zn²⁺ + 2e⁻ → Zn','Zn²⁺','Zn',-0.76),M('Mn²⁺ + 2e⁻ → Mn','Mn²⁺','Mn',-1.19),M('Al³⁺ + 3e⁻ → Al','Al³⁺','Al',-1.66),M('Mg²⁺ + 2e⁻ → Mg','Mg²⁺','Mg',-2.37),M('Na⁺ + e⁻ → Na','Na⁺','Na',-2.71),M('Ca²⁺ + 2e⁻ → Ca','Ca²⁺','Ca',-2.87),M('K⁺ + e⁻ → K','K⁺','K',-2.93),M('Li⁺ + e⁻ → Li','Li⁺','Li',-3.04)];})();
function f2(v){return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2);}
function tools(){
  var opts=ETAB.map(function(r,i){return '<option value="'+i+'">'+r[0]+'  ('+f2(r[3])+' V)</option>';}).join('');
  var h='<div class="phead"><h1>🧰 Tools &amp; cheat sheets</h1><p class="muted">Quick references for the night before the exam.</p></div>'+
  '<div class="card"><h2>🔋 E°cell calculator</h2><p class="muted">Pick any two half-cells. The calculator finds the cathode, anode, E°cell, cell notation and spontaneity — then explains each step.</p>'+
  '<div class="calc2"><label>Half-cell 1<select id="h1">'+opts+'</select></label><label>Half-cell 2<select id="h2">'+opts+'</select></label></div><div id="cout"></div></div>';
  h+='<div class="card"><h2>📈 Standard reduction potentials (25 °C, 1 M, 1 atm)</h2><table class="tbl etab"><tr><th>Half-reaction</th><th>E° (V)</th></tr>'+ETAB.map(function(r){return '<tr'+(r[3]===0?' class="she"':'')+'><td>'+r[0]+'</td><td>'+f2(r[3])+'</td></tr>';}).join('')+'</table><p class="muted small">Top = strongest oxidizing agents (left side). Bottom = strongest reducing agents (right side). Your exam will give you the values you need.</p></div>';
  h+='<div class="two"><div class="card"><h2>🔢 Oxidation number rules</h2><ol class="rules"><li>Element = 0</li><li>Monatomic ion = its charge</li><li>F = −1 always</li><li>O = −2 (peroxide −1, OF₂ +2)</li><li>H = +1 (metal hydride −1)</li><li>Group 1 = +1, Group 2 = +2, Al = +3</li><li>Sum = 0 (compound) or charge (ion)</li></ol></div>'+
  '<div class="card"><h2>⚖️ Half-reaction method</h2><ol class="rules"><li>Net ionic equation</li><li>Split into two halves</li><li>Balance atoms ≠ O, H</li><li>O → H₂O</li><li>H → H⁺</li><li>Charge → e⁻</li><li>Equalize e⁻, add, cancel</li><li><b>Base:</b> add OH⁻ = H⁺ to both sides, make H₂O, cancel</li></ol></div></div>';
  h+='<div class="two"><div class="card"><h2>🧠 Memory hooks</h2><ul class="bul"><li><b>OIL RIG</b> — Oxidation Is Loss, Reduction Is Gain</li><li><b>AN OX · RED CAT</b> — oxidation at anode, reduction at cathode</li><li><b>Electrons A → C</b> through the wire (alphabetical)</li><li>Oxidizing agent is <b>reduced</b>; reducing agent is <b>oxidized</b></li><li><b>E°cell = E°cathode − E°anode</b>; never multiply E°</li><li><b>Coat the Cathode</b> in electroplating</li></ul></div>'+
  '<div class="card"><h2>⚡ vs 🔌 at a glance</h2><table class="tbl"><tr><th></th><th>Voltaic</th><th>Electrolytic</th></tr><tr><td>Spontaneous?</td><td>Yes</td><td>No</td></tr><tr><td>Anode</td><td>− oxidation</td><td>+ oxidation</td></tr><tr><td>Cathode</td><td>+ reduction</td><td>− reduction</td></tr><tr><td>Energy</td><td>chem → elec</td><td>elec → chem</td></tr><tr><td>E°cell</td><td>&gt; 0</td><td>&lt; 0</td></tr></table></div></div>';
  view(h);$('#h1').value=9;$('#h2').value=18;$('#h1').onchange=$('#h2').onchange=calc;calc();}
function calc(){
  var a=ETAB[+$('#h1').value],b=ETAB[+$('#h2').value],o=$('#cout');
  if(a===b){o.innerHTML='<div class="warn">Choose two different half-cells.</div>';return;}
  var cat=a[3]>=b[3]?a:b,an=cat===a?b:a;var E=cat[3]-an[3];
  var anL=an[4],caR=cat[5];
  o.innerHTML='<div class="cres"><div><span>Cathode (reduction, higher E°)</span><b>'+cat[0]+'</b></div><div><span>Anode (oxidation, lower E°)</span><b>'+an[0].replace(/(.+) \+ (\d?)e⁻ → (.+)/,'$3 → $1 + $2e⁻').replace(' (SHE)','')+'</b></div>'+
  '<div class="big"><span>E°cell = E°cathode − E°anode</span><b>'+f2(cat[3])+' − ('+f2(an[3])+') = '+f2(E)+' V</b></div>'+
  '<div><span>Cell notation</span><b>'+anL+' ‖ '+caR+'</b></div><div><span>Verdict</span><b>'+(E>0?'✅ Spontaneous as a voltaic cell. The reverse direction would be '+f2(-E)+' V → non-spontaneous (needs electrolysis).':'Both half-cells have the same potential — no voltage.')+'</b></div><div><span>Remember</span><b>E° values are never multiplied by the coefficients used to balance electrons.</b></div></div>';}

  applyTheme();

  window.addEventListener('hashchange',function(){if(RUN&&!/^#exam-|^#unit-/.test(location.hash)){/* leaving a run */RUN=null;}route();});
  route();});
})();
